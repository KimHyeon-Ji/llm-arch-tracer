    profile: models/phase9-deepseek-v3.yaml
    phase: 9
    tags: [scale-complex, MLA, MoE-shared+routed, sigmoid-gating, dense-prefix]
    # 671B/37B real size: 61 layers, MLA, E=256 top-8 + shared, dense-prefix 3, sigmoid gating
