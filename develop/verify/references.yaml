# 외부 공개 수치 — 우리 계산이 독립 소스와 일치하는지 교차검증하는 기준값.
#
# 왜 파일로 두는가: 이 값들을 스크립트 안에 하드코딩해두면 "검증했다"는 주장만 남고
# 근거(출처·시점)가 사라진다. 여기 두면 verify_all.py가 매번 대조하고, 값이 바뀌면
# 출처를 다시 확인하게 된다.
#
# 주의: 이건 **라벨 교차검증용**이지 shape 값의 출처가 아니다(01-main.md P1).
# 우리 숫자는 전부 트레이스에서 나오고, 여기 값과 "우연히" 맞추려고 계산을 바꾸지 않는다.

kv_cache_per_token:
  source: "https://sebastianraschka.com/llm-architecture-gallery/"
  method: "https://sebastianraschka.com/llm-architecture-gallery/kv-cache-calculations/"
  checked_on: "2026-07-27"
  note: >
    BF16 2바이트. 표준 attention은 4·n_kv·d_head, K==V 통합이면 2·n_kv·d_head,
    MLA는 2·(kv_lora_rank + qk_rope_head_dim). 증가하는 캐시를 가진 레이어만 합산.
    밴드 경계(KiB): 24 / 72 / 160 / 300.
  values:
    openai-community__gpt2-xl: "300.0 KiB (High)"
    allenai__OLMo-2-1124-7B-Instruct: "512.0 KiB (Very high)"
    meta-llama__Llama-3.1-8B: "128.0 KiB (Moderate)"
    meta-llama__Llama-4-Maverick-17B-128E: "192.0 KiB (High)"
    google__gemma-3-270m: "18.0 KiB (Very low)"
    Qwen__Qwen3-30B-A3B: "96.0 KiB (Moderate)"
    HuggingFaceTB__SmolLM3-3B-Base: "72.0 KiB (Low)"
    zai-org__GLM-4.5-Air: "184.0 KiB (High)"
    openai__gpt-oss-20b: "48.0 KiB (Low)"
    openai__gpt-oss-120b: "72.0 KiB (Low)"
    deepseek-ai__DeepSeek-V3: "68.6 KiB (Low)"
    deepseek-ai__DeepSeek-V4-Flash: "5.4 KiB (Very low)"
    deepseek-ai__DeepSeek-V4-Pro: "7.7 KiB (Very low)"
    Qwen__Qwen3-Next-80B-A3B-Instruct: "24.0 KiB (Very low)"

# 소프트맥스 attention을 실제로 돌리는 레이어 수. Q 투영(q_proj / query_key_value / c_attn …)
# 보유 여부로 트레이스에서 직접 센다 -- 모듈 이름은 계열마다 제각각이라(Nemotron은 attention도
# Mamba도 전부 `mixer`, Falcon은 `self_attention`) 이름 기반 규칙은 매번 깨졌다.
# 여기 기록해두는 이유: 2026-07-30에 이름 기반 규칙으로 바꿨다가 falcon(32→0)과
# Nemotron(4→0)이 조용히 attention-free로 뒤집혔는데, 두 모델 다 갤러리 대조 목록에 없어서
# 게이트가 그냥 통과시켰다. 이제 이 값이 어긋나면 실패한다.
# active 파라미터 수 — 벤더 발표치와 우리 값이 다를 수 있고, 그게 오류가 아닌 경우.
# 자유 평가(2026-07-30)에서 GLM-4.5-Air가 공식 12B인데 우리는 13.42B로 나와 파고든 결과:
# 공식은 **본체만**(임베딩·lm_head 제외) 센 값이었다. 반대로 DeepSeek-V3는 공식 37B인데
# 임베딩 포함(37.55B)이 더 가깝고 제외하면 35.7B로 멀어진다 — 즉 벤더마다 관례가 다르다.
# 우리는 "토큰 1개 forward가 실제로 거치는 파라미터"로 통일하고 카드에 기준을 명시한다.
# 여기 적어두는 이유: 다음에 같은 불일치를 보고 "버그"로 오판하지 않기 위해서다.
active_param_convention:
  ours: "embedding + lm_head 포함 (토큰 1개가 실제로 거치는 전부)"
  checked_on: "2026-07-30"
  observed_vendor_gaps:
    zai-org__GLM-4.5-Air: "공식 12B = 본체만. 우리 13.42B = 본체 12.18B + embed 0.62B + head 0.62B"
    deepseek-ai__DeepSeek-V3: "공식 37B. 우리 37.55B(임베딩 포함)가 더 근접, 제외 시 35.7B"

attention_layers:
  note: "0 = attention-free(순환/SSM). L과 같으면 전 레이어 attention, 그 사이면 하이브리드."
  checked_on: "2026-07-30"
  values:
    NX-AI__xLSTM-7b: 0
    Qwen__Qwen3-Next-80B-A3B-Instruct: 12
    Zyphra__Zamba2-1.2B: 6
    nvidia__NVIDIA-Nemotron-3-Nano-4B-BF16: 4
    tiiuae__falcon-7b: 32
    deepseek-ai__DeepSeek-V4-Pro: 61
    meta-llama__Llama-3.1-405B: 126
    openai__gpt-oss-20b: 24
    google__gemma-2-2b: 26

# config에 필드가 없어 modeling 코드에서만 확인되는 사실. resolve_symbols가 결정적으로 채운다.
# 여기 적어두는 이유: alias로 안 잡히는 값을 코드에 하드코딩하면 근거가 사라지기 때문이다.
modeling_sourced_symbols:
  checked_on: "2026-07-30"
  n_sink:
    value: 1
    models: [openai__gpt-oss-20b, openai__gpt-oss-120b]
    gate: "config.model_type == 'gpt_oss'"
    source: >
      transformers 5.14.1 models/gpt_oss/modeling_gpt_oss.py — GptOssAttention.sinks는 head당
      스칼라 1개이고, score 행렬에 **1열**로 concat된다(head당 1열이 아니라 축 하나에 +1).
      교차검증: gpt-oss 모델 카드(arXiv:2508.10925) "the denominator of the softmax has an
      additional additive value". rules/structures/attention/attention-sink.md 참고.
    note: >
      deepseek_v4도 같은 기법을 쓰지만 여기 넣지 않는다 — V4의 score 폭은 derived_dims.yaml에
      `T + T/m_csa + 1` 형태로 이미 명시돼 있고, n_sink를 켜면 일반 규칙 `T + 1 + n_sink`가
      score 폭이 아닌 V4 축에 발동할 수 있다.

# 아키텍처 차원이 아니라 op 자체의 구조 상수라, 심볼을 붙이면 오히려 거짓이 되는 값들.
# verify_all.py가 "설명 안 된 bare 정수"를 셀 때 이건 정상으로 간주한다.
# 2026-07-31 자유 평가 이후 갱신. 휴리스틱이 스코프 밖 심볼로 식을 지어내던 것을 막자,
# 그동안 가짜 이름에 가려져 있던 진짜 기약 정수들이 드러났다. 아래는 전수 확인한 목록이며
# 이 밖에 남은 정수는 없다(V4-Pro {2,3,8}, V4-Flash {2,3}, Qwen3-Next는 언롤 경계뿐).
# 기계 검사용 `values:` 를 함께 둔다. 이 목록에 없는 정수가 산출물에 나오면 게이트가
# WARN 으로 띄운다 — "이름이 없다"와 "이름이 없는 이유를 안다"를 구분하기 위해서다.
# 2026-08-06 기준 함대의 모든 bare 정수가 여기 덮인다.
irreducible_literals:
  - value_note: "복소수 pair 분할(view_as_real / stack→view)의 마지막 축 2"
    values: [2]
    models: [all]
  - value_note: >
      Gated DeltaNet 청크 스캔의 언롤된 루프 경계. `linear_attn` 안의 slice/clone 이
      반복마다 한 칸씩 넓은 조각을 떼며 3,4,5,…,10 의 연속 사다리를 만든다(모델마다 같은
      횟수씩 — Qwen3.6-27B 는 각 값이 정확히 288 회). 반복 계단이지 아키텍처 상수가 아니다.
      예전에는 홀수만 정수로 남고 짝수는 값이 겹치는 심볼 이름을 달고 있었는데(n_kv=2,
      d_conv_lin=4, k=10 …), 그 지어낸 이름을 떼면서 사다리 전체가 드러났다
      (build_table._unname_refilled_operands, 2026-08-12).
    values: any_small_odd_or_scan
    models: [Qwen__Qwen3-Next-80B-A3B-Instruct, Qwen__Qwen3.5-4B, Qwen__Qwen3.6-27B,
             Qwen__Qwen3.6-35B-A3B]
  - value_note: >
      mHC의 scale 파라미터 개수 3 — pre/post/comb 세 게이트 계열에 각각 하나씩이며
      `unbind [3] -> [], [], []`로 나타난다. config 값이 아니라 모듈 구조 상수다.
      rules/structures/residual/mhc.md의 `attn_hc.scale [3]` 참고.
      (0731 리비전은 `attn_hc.scale`/`ffn_hc.scale` 로 같은 구조를 그대로 갖는다.)
    values: [3]
    models: [deepseek-ai__DeepSeek-V4-Pro, deepseek-ai__DeepSeek-V4-Flash,
             deepseek-ai__DeepSeek-V4-Flash-0731]
  - value_note: >
      V4-Pro Lightning Indexer의 8 — `new_zeros [B,d_head,n_hc,d_head/2]`로 잡은 버퍼를
      `[B,d_head,8,c_I]`로 재해석했다가(4·256 = 8·128) 곧바로 n_hc로 slice해 되돌린다.
      값은 2·n_hc지만 아키텍처 차원이라는 근거를 못 찾았으므로 이름을 붙이지 않는다(Tier 3).
    values: [8]
    models: [deepseek-ai__DeepSeek-V4-Pro]
