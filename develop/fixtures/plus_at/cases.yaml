# +@ fixture — **사람이 직접 썼다.** 코드로 생성하지 않는다.
#
# 왜 손으로 쓰는가 (외부 검토 2026-09-27)
#   적용기와 독립 matcher 를 같은 사람이 구현하면 의미 독립성이 생기지 않는다. fixture 가
#   **구현 독립성**을, blind R1 이 **의미 독립성**을 담당한다. 둘 중 하나만으로는 부족하다.
#
# 검토가 지정한 포함 항목 11 가지를 전부 담았다:
#   A 정상 exp 축 / residual 5 negative control / exp 아닌 5 /
#   axis·field·shape_index·module 각각 하나씩 틀린 사례 /
#   expert 0~2 regular / expert 3 last / 상위 concat 입력 0~2 와 입력 3 /
#   prefill·decode 양쪽 / N_route % C_trace != 0 인 몫·나머지 /
#   N_route < C_trace 가 validity-domain 밖이라 거부되는 사례
#
# `rows` 는 발행본 jsonl 한 줄과 같은 모양이다(필요한 열만 적는다).
# `expect` 는 그 행에서 바뀌어야 하는 canonical cell 목록이다. 비어 있으면 **하나도
# 바뀌지 않아야 한다**(negative control).

symbols:
  # 이 fixture 전용 값. 실제 모델과 다르게 잡아 식이 값에 기대지 않는지 본다.
  B: 2
  T: 128
  k: 8
  d_chunk: 32
  C_trace: 4
  # N_route = B*T*k = 2048,  q = 512,  last = 2048 - 3*512 = 512
  N_route_prefill: 2048
  N_route_decode: 16          # B*k = 16, q = 4, last = 16-12 = 4

cases:

  # ---------------------------------------------------------------- 계열 A: 정상
  - name: "A 정상 -- self_attn 의 exp, 청크 축"
    phase: prefill
    row:
      op_id: 100
      op_type: exp
      module_path: "model.layers.0.self_attn"
      input_shape: [["B", "n_h_kda", "4", "d_chunk", "d_head_kda"]]
      output_shape: [["B", "n_h_kda", "4", "d_chunk", "d_head_kda"]]
    literal: "4"                 # T/d_chunk = 128/32 = 4
    expect:
      - {field: input_shape, shape_index: 0, axis: 2, after: n_chunk}
      - {field: output_shape, shape_index: 0, axis: 2, after: n_chunk}

  # ------------------------------------------------- 계열 A: negative control 3 종
  - name: "A 음성 -- residual 누적의 4 (모듈이 self_attn 이 아니다)"
    phase: prefill
    row:
      op_id: 101
      op_type: concat
      module_path: "model.layers.3"
      input_shape: [["B*T", "3", "d_model"], ["B*T", "1", "d_model"]]
      output_shape: [["B*T", "4", "d_model"]]
    expect: []

  - name: "A 음성 -- self_attn 이지만 op 가 exp 가 아니다"
    phase: prefill
    row:
      op_id: 102
      op_type: clone
      module_path: "model.layers.0.self_attn"
      input_shape: [["B", "n_h_kda", "4", "d_chunk", "d_head_kda"]]
      output_shape: [["B", "n_h_kda", "4", "d_chunk", "d_head_kda"]]
    expect: []

  - name: "A 음성 -- causal prefix (shape 에 4 가 둘이라 V3 가 막아야 한다)"
    phase: prefill
    row:
      op_id: 103
      op_type: exp
      module_path: "model.layers.0.self_attn"
      input_shape: [["B", "n_h_kda", "4", "d_chunk", "4"]]
      output_shape: [["B", "n_h_kda", "4", "d_chunk", "4"]]
    expect: []
    expect_v3_fail: true         # 같은 맨정수가 한 shape 에 둘 -> 전체 적용 중단

  # ------------------------------------- 계열 A: 선택자 한 군데씩 틀린 사례 4 종
  - name: "A 변형 -- axis 가 2 가 아니라 3 인 자리는 안 바뀐다"
    phase: prefill
    row:
      op_id: 104
      op_type: exp
      module_path: "model.layers.0.self_attn"
      input_shape: [["B", "n_h_kda", "d_chunk", "4", "d_head_kda"]]
      output_shape: [["B", "n_h_kda", "d_chunk", "4", "d_head_kda"]]
    expect: []                   # shape 전체 일치가 아니므로 안 걸린다

  - name: "A 변형 -- field 가 weight_shape 면 안 바뀐다"
    phase: prefill
    row:
      op_id: 105
      op_type: exp
      module_path: "model.layers.0.self_attn"
      input_shape: []
      weight_shape: ["B", "n_h_kda", "4", "d_chunk", "d_head_kda"]
      output_shape: []
    expect: []

  # 이 사례가 두 구현의 divergence 를 잡았다(2026-09-27). 처음에는 "shape 가 같으면
  # 피연산자 번호와 무관하게 바뀐다" 로 적었는데, overlay 는 shape_index: 0 으로 못 박고
  # 있었고 refmatch 는 그것을 안 봤다. `exp` 는 단항이라 실제 자리에는 차이가 없지만
  # 규칙이 넓으면 구현이 갈린다 -- **좁은 쪽(피연산자 0 전용)으로 확정**했다.
  - name: "A 변형 -- shape_index 1 은 규칙 밖이다 (피연산자 0 전용)"
    phase: prefill
    row:
      op_id: 106
      op_type: exp
      module_path: "model.layers.0.self_attn"
      input_shape:
        - ["B", "n_h_kda", "d_chunk", "d_head_kda"]
        - ["B", "n_h_kda", "4", "d_chunk", "d_head_kda"]
      output_shape: []
    expect: []

  - name: "A 변형 -- module 이 self_attn 의 자식이면 안 바뀐다"
    phase: prefill
    row:
      op_id: 107
      op_type: exp
      module_path: "model.layers.0.self_attn.q_proj"
      input_shape: [["B", "n_h_kda", "4", "d_chunk", "d_head_kda"]]
      output_shape: []
    expect: []

  # ---------------------------------------------- 계열 B: expert regular / last
  #
  # **이 계열은 R1(blind 독립 도출, 2026-09-27)의 판정으로 철회됐다.** 실제 per-expert
  # 토큰 축은 cannot determine 이고, 식을 붙이면 shim 의 균등분할 대체값이 모델
  # 아키텍처처럼 보인다. 사례는 **지우지 않는다** -- 다시 논의될 수 있고, 아래 arithmetic
  # 절은 몫/나머지 식 자체의 정확성을 여전히 시험한다.
  # 아래 사례들은 `withdrawn: true` 라서 활성 overlay 대조 시험에서 건너뛴다.
  - name: "B regular -- expert 0"
    withdrawn: true        # R1 판정으로 철회
    phase: prefill
    row:
      op_id: 200
      op_type: matmul
      module_path: "model.layers.1.block_sparse_moe.experts.0.w1"
      input_shape: [["512", "d_moe_lat"], ["d_moe_lat", "d_moe"]]
      output_shape: [["512", "d_moe"]]
    literal: "512"               # q = floor(2048/4)
    expect:
      - {field: input_shape, shape_index: 0, axis: 0, after: n_trace_regular}
      - {field: output_shape, shape_index: 0, axis: 0, after: n_trace_regular}

  - name: "B regular -- expert 2"
    withdrawn: true        # R1 판정으로 철회
    phase: prefill
    row:
      op_id: 201
      op_type: tanh
      module_path: "model.layers.1.block_sparse_moe.experts.2"
      input_shape: [["512", "d_moe"]]
      output_shape: [["512", "d_moe"]]
    expect:
      - {field: input_shape, shape_index: 0, axis: 0, after: n_trace_regular}
      - {field: output_shape, shape_index: 0, axis: 0, after: n_trace_regular}

  - name: "B last -- expert 3 은 나머지를 받는다"
    withdrawn: true        # R1 판정으로 철회
    phase: prefill
    row:
      op_id: 202
      op_type: matmul
      module_path: "model.layers.1.block_sparse_moe.experts.3.w2"
      input_shape: [["512", "d_moe"], ["d_moe", "d_moe_lat"]]
      output_shape: [["512", "d_moe_lat"]]
    expect:
      - {field: input_shape, shape_index: 0, axis: 0, after: n_trace_last}
      - {field: output_shape, shape_index: 0, axis: 0, after: n_trace_last}

  # ---------------------------------------- 계열 B: 상위 concat 의 피연산자 대응
  - name: "B concat -- 입력 0..2 는 regular, 마지막 입력은 last"
    withdrawn: true        # R1 판정으로 철회
    phase: prefill
    row:
      op_id: 203
      op_type: concat
      module_path: "model.layers.1.block_sparse_moe"
      input_shape:
        - ["512", "d_moe_lat"]
        - ["512", "d_moe_lat"]
        - ["512", "d_moe_lat"]
        - ["512", "d_moe_lat"]
      output_shape: [["B*k*T", "d_moe_lat"]]
    expect:
      - {field: input_shape, shape_index: 0, axis: 0, after: n_trace_regular}
      - {field: input_shape, shape_index: 1, axis: 0, after: n_trace_regular}
      - {field: input_shape, shape_index: 2, axis: 0, after: n_trace_regular}
      - {field: input_shape, shape_index: 3, axis: 0, after: n_trace_last}

  # -------------------------------------------------------------- decode 양쪽
  - name: "B decode -- expert 0 regular"
    withdrawn: true        # R1 판정으로 철회
    phase: decode
    row:
      op_id: 300
      op_type: matmul
      module_path: "model.layers.1.block_sparse_moe.experts.0.w1"
      input_shape: [["4", "d_moe_lat"], ["d_moe_lat", "d_moe"]]
      output_shape: [["4", "d_moe"]]
    literal: "4"                 # floor(16/4)
    expect:
      - {field: input_shape, shape_index: 0, axis: 0, after: n_trace_regular}
      - {field: output_shape, shape_index: 0, axis: 0, after: n_trace_regular}

  - name: "B decode -- expert 3 last"
    withdrawn: true        # R1 판정으로 철회
    phase: decode
    row:
      op_id: 301
      op_type: matmul
      module_path: "model.layers.1.block_sparse_moe.experts.3.w1"
      input_shape: [["4", "d_moe_lat"], ["d_moe_lat", "d_moe"]]
      output_shape: [["4", "d_moe"]]
    expect:
      - {field: input_shape, shape_index: 0, axis: 0, after: n_trace_last}
      - {field: output_shape, shape_index: 0, axis: 0, after: n_trace_last}

# ------------------------------------------------------------------ 식 자체 검사
# 행 매칭과 별개로 symbols 의 식이 몫/나머지를 **정확히** 내는지 본다.
arithmetic:
  - name: "나누어떨어지는 경우 -- regular 와 last 가 같은 값"
    N_route: 2048
    C_trace: 4
    expect_regular: 512
    expect_last: 512

  - name: "N_route % C_trace != 0 -- last 가 나머지를 받는다"
    N_route: 2050
    C_trace: 4
    expect_regular: 512           # floor(2050/4)
    expect_last: 514              # 2050 - 3*512

  - name: "나머지가 큰 경우"
    N_route: 15
    C_trace: 4
    expect_regular: 3
    expect_last: 6                # 15 - 3*3

  - name: "N_route < C_trace 는 validity-domain 밖 -- 거부되어야 한다"
    N_route: 3
    C_trace: 4
    expect_reject: true
    reason: "valid_when 의 N_route >= C_trace 를 위반한다"

# ==========================================================================
# 계열 C (residual 누적) — **사람이 직접 쓴** stage 판별 사례
# ==========================================================================
# stage 를 값이 아니라 op lineage 로 정한다는 것을 시험한다. 값으로 고르면 1,262 셀 중
# 216 셀만 식이 유일하다(실측) -- 그래서 이 사례들이 필요하다.
#
# R = 4, L = 9 로 잡아 실제 모델(12, 93)과 다르게 둔다. 식이 값에 기대지 않는지 본다.
#   b_in(l)    = ceil(l/4)      b_after(l) = ceil((l+1)/4)
#   c_pre(l)   = ceil(l/4)+1    c_post(l)  = ceil((l+1)/4)+1
#   b_final    = ceil(9/4) = 3  c_final    = 4

residual:
  R_res: 4
  L_layers: 9

  cases:
    # 층 0 -- 버퍼가 비어 pre-mix 가 없다. mix 그룹이 하나뿐이고 그것은 **post** 다.
    # 앞에서부터 세면 pre 로 잘못 붙는다(실측에서 12 건이 어긋났다).
    # stage 는 **norm 가중치 이름**으로 정한다(2026-09-28 에 op 순서에서 바꿨다).
    # 층 0 은 pre-mix 가 없으므로 mlp_res_norm 하나뿐이다.
    - name: "층 0 -- 그룹이 하나뿐이면 post 다"
      layer: 0
      norms: {11: mlp_res_norm}
      ops:
        - {op_id: 10, op_type: concat, kind: append,
           i: [[tok, 0, d], [tok, 1, d]], o: [[tok, 1, d]]}
        - {op_id: 11, op_type: concat, kind: mix, dep: [10],
           i: [[tok, 1, d], [tok, 1, d]], o: [[tok, 2, d]]}
        - {op_id: 12, op_type: sum, dep: [11], i: [[tok, 2, d]], o: [[tok, 2]]}
      expect_stage: {11: mix_post, 12: mix_post, 10: boundary_append}
      expect_formula: {11: c_post, 12: c_post}
      # b_after(0) = ceil(1/4) = 1,  c_post(0) = 2   -> 관측값 2 와 맞는다

    # 층 5 -- pre 와 post 두 그룹. 뒤가 post.
    - name: "층 5 -- norm 이름이 pre/post 를 가른다 (값은 둘 다 3)"
      layer: 5
      norms: {20: self_attention_res_norm, 22: mlp_res_norm}
      ops:
        - {op_id: 20, op_type: concat, kind: mix,
           i: [[tok, 2, d], [tok, 1, d]], o: [[tok, 3, d]]}
        - {op_id: 21, op_type: softmax, dep: [20], i: [[tok, 3]], o: [[tok, 3]]}
        - {op_id: 22, op_type: concat, kind: mix,
           i: [[tok, 2, d], [tok, 1, d]], o: [[tok, 3, d]]}
        - {op_id: 23, op_type: softmax, dep: [22], i: [[tok, 3]], o: [[tok, 3]]}
      expect_stage: {20: mix_pre, 21: mix_pre, 22: mix_post, 23: mix_post}
      expect_formula: {20: c_pre, 22: c_post}
      # b_in(5) = ceil(5/4) = 2,  c_pre(5) = 3,  b_after(5) = ceil(6/4) = 2, c_post = 3
      # **같은 값 3 이지만 stage 가 다르다** -- 값으로는 못 가른다는 것이 이 사례의 요점

    # 경계 층 -- l % R == 0 에서 버퍼가 커진다.
    # **층 8 을 쓴다.** 층 4 는 b_in(4) = ceil(4/4) = 1 이고 리터럴 1 은 정당한 singleton
    # 이라 애초에 대상(2..9)이 아니다 -- 처음 층 4 로 썼다가 코드가 잡았다.
    #   b_in(8) = ceil(8/4) = 2,  b_after(8) = ceil(9/4) = 3
    - name: "층 8 -- 경계에서 append 가 일어난다 (버퍼 폭도 대상이다)"
      layer: 8
      ops:
        - {op_id: 30, op_type: concat, kind: append,
           i: [[tok, 2, d], [tok, 1, d]], o: [[tok, 3, d]]}
      expect_stage: {30: boundary_append}
      expect_formula_buf: {30: b_in}      # 피연산자 0 = 버퍼 폭 = 2
      expect_formula_mix: {30: b_after}   # 출력 = 3

    # 층 밖 (module == model) -- final.
    # **혼합 체인을 함께 둔다.** concat 하나만 두면 소비자가 없어 append 로 분류된다
    # (판별 기준이 "혼합 체인 op 로 가는가" 이므로). 처음엔 concat 만 뒀다가 코드가 잡았다.
    - name: "층 밖 -- final 이다"
      layer: null
      norms: {40: output_attn_res_norm}
      ops:
        - {op_id: 40, op_type: concat, kind: mix, module: model,
           i: [[tok, 3, d], [tok, 1, d]], o: [[tok, 4, d]]}
        - {op_id: 41, op_type: softmax, module: model, dep: [40],
           i: [[tok, 4]], o: [[tok, 4]]}
      expect_stage: {40: mix_final, 41: mix_final}
      expect_formula: {40: c_final, 41: c_final}
      expect_formula_buf: {40: b_final}   # 피연산자 0 = ceil(9/4) = 3
      # b_final = ceil(9/4) = 3,  c_final = 4

  # 식 자체 검사 -- 값에 기대지 않는다
  arithmetic:
    - {name: "b_in 은 진입 시 저장 수", R: 4, l: 0, formula: b_in, expect: 0}
    - {name: "b_after 는 경계 후", R: 4, l: 0, formula: b_after, expect: 1}
    - {name: "c_pre 는 b_in+1", R: 4, l: 5, formula: c_pre, expect: 3}
    - {name: "c_post 는 b_after+1", R: 4, l: 5, formula: c_post, expect: 3}
    - {name: "경계 직전", R: 4, l: 3, formula: b_after, expect: 1}
    - {name: "경계", R: 4, l: 4, formula: b_after, expect: 2}
    - {name: "c_final", R: 4, L: 9, formula: c_final, expect: 4}
