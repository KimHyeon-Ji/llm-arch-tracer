# V9 게이트별 **검토 상태.** 적용기는 이 파일을 읽고, `accepted` 가 아닌 게이트가 하나라도
# 있으면 release 를 막는다(provisional). 예전에는 적용기가 무조건 `proposed` 를 기록해
# 검토 상태가 release 를 막지 못했다 -- 외부 검토 R3 의 차단 사항 3.
#
# 이 파일은 **사람이 검토 결과를 받아 고친다.** 도구가 쓰지 않는다.
#
# review_status:  proposed | accepted
#   proposed  아직 외부 검토를 받지 않았거나 조건이 남았다
#   accepted  검토자가 그 게이트의 처분(rerun / inherited_unchanged / not_evaluated)을
#             근거와 함께 받아들였다

gates:
  schema_shape_rank_token_type:        {review_status: proposed}
  symbol_declared:                     {review_status: proposed}
  expression_no_cycle:                 {review_status: proposed}
  substitution_nonneg_integer:         {review_status: proposed}
  zero_axis_only_initial_residual:     {review_status: proposed}
  batch_seq_head_axis_consistency:     {review_status: proposed}
  head_scope_exclusive:                {review_status: proposed}
  moe_quotient_remainder_consistency:  {review_status: proposed}
  prefill_decode_structure:            {review_status: proposed}
  layers_repeat_consistency:           {review_status: proposed}
  row_metadata_preserved:              {review_status: proposed}
  op_id_dag:                           {review_status: proposed}

  # 재실행으로 바꿨다. 외부 검토가 "구조는 그대로지만 symbolic label 이 바뀌므로
  # 재검사하거나 불변 승계의 구체적 증명을 기록해야 합니다" 라고 했다.
  reshape_derivation:                  {review_status: proposed}

  # R3d 판정: 이름대로 검사해야 한다. 파일 해시 + cell 키 불변만 보던 것을 raw op-id
  # 집합 == ports op-id 집합 / 중복 / schema 검사로 바꾸고 decision 을 rerun 으로 올렸다.
  port_coverage:                       {review_status: proposed}

  # crosswalk 을 경유해 재실행한다. raw slot 존재·범위 검사와 crosswalk 커버리지 검사가
  # fail-closed 다. n_ck == len(roots) 는 항등식이라 근거로 세지 않는다(R3d Q3).
  axis_class_consistency:              {review_status: proposed}

  # 사이드카는 bundle 의 일부다. 양 phase 의 구조 multiset 을 맞춘다(op_id 만 제외).
  sidecar_phase_consistency:           {review_status: proposed}

  # R3d 차단 3: 사이드카 식이 V9 에서 전혀 검사되지 않았다. registry 일치·식별자 선언·
  # 식값 == value·join key 유일·선언했는데 레코드 없으면 not_run 을 본다.
  sidecar_expression_integrity:        {review_status: proposed}

  # R3d 차단 4: base_table_symbols 가 dangling pointer 였다. 실제 authority 는
  # full/provenance.json 의 symbol_table 이고, 그것 + table_added_symbols 가 본표
  # 식별자를 덮는지 여기서 센다.
  base_symbol_coverage:                {review_status: proposed}
