# +@ overlay — moonshotai__Kimi-K3
#
# 이것은 **입력**이다. 적용기(develop/plus_at_apply.py)도, 독립 matcher
# (develop/plus_at_refmatch.py)도 이 파일만 읽는다. 생성물은 models/<m>/plus_at/ 에 있다.
#
# 규약 (외부 검토 2026-09-27 승인본)
#   - match 는 shape **전체 일치** + 축 위치. 값만 보는 치환은 쓰지 않는다.
#   - must_match / must_not_match exemplar 가 각각 맞고 틀려야 한다(V8).
#   - accepted 항목만 적용한다. proposed/reviewed 는 provisional 산출물에만 들어간다.
#   - 근거는 파일:줄 + sha256. 줄 번호 없는 항목은 적용하지 않는다.
#   - 트레이서가 나중에 같은 자리를 고치면 `before` 불일치로 **자동 실패**한다.

schema_version: 1
model: moonshotai__Kimi-K3

# **사전 승인된 변경 허용 목록.** 적용기는 이 파일을 다시 만들지 않고 읽기만 한다
# (외부 검토 R3 의 차단 사항 1). 해시를 여기 박아 두면 적용기가 파일이 바뀐 것을 잡는다.
# 만드는 법: develop/plus_at_refmatch.py <모델디렉터리> <이 overlay> <출력 경로>
expected_footprint:
  path: develop/plus_at/expected-moonshotai__Kimi-K3.jsonl
  sha256: 997726a9476fa6d21446358072d000c46206682684265d1b9a811a0dcb7d9412
  cells: 3342
  review_status: proposed        # R1/R2 독립 검토 뒤 accepted


symbols:
  # 표에 새로 등장하는 이름. kind 로 아키텍처와 트레이스 제어를 가른다.
  n_chunk:
    kind: architecture
    expr: "T / d_chunk"
    value: 5
    validity_domain: ["T % d_chunk == 0"]
  N_route:
    kind: architecture
    expr_prefill: "B*T*k"
    expr_decode: "B*k"
    value_prefill: 15360
    value_decode: 48
  # ---- 계열 C: residual 누적. 값이 **층에 따라 다르다.** 그래서 식이 `l` 을 쓴다.
  l:
    kind: row_field              # 심볼이 아니라 **그 행의 layer_idx** 다
    source: "표의 layer_idx 열"
    note: >
      접힌 행(repeat/layers)에서도 그 행의 모든 층에서 식이 같은 값을 낸다 -- 적용기가
      층마다 산술로 확인한다. 그래서 대표 layer_idx 로 대입해도 된다.
  R_res:
    kind: architecture
    expr: "config.text_config.attn_res_block_size"
    value: 12
  L_layers:
    kind: architecture
    expr: "config.text_config.num_hidden_layers"
    value: 93
  C_trace:
    kind: trace_control          # **아키텍처 심볼이 아니다**
    origin: adaptation
    expr: "trace.expert_cap"
    value: 4
    note: >
      이 트레이스가 레이어당 실제로 돌린 전문가 수다. 모델은 896 개를 가진다
      (E = 896). adaptation_log 의 remedy "moe_infer_even_split" 이 기록한다.
  n_trace_regular:
    kind: trace_control
    origin: adaptation
    expr: "floor(N_route / C_trace)"
    value_prefill: 3840
    value_decode: 12
  n_trace_last:
    kind: trace_control
    origin: adaptation
    expr: "N_route - (C_trace - 1) * floor(N_route / C_trace)"
    value_prefill: 3840
    value_decode: 12
    note: >
      shim 은 몫/나머지로 나눈다 -- src/kda_shim.py:641-647 의
      `per = max(1, n // traced)` 와 `end = n if i == traced-1 else min(n, start+per)`.
      마지막 전문가가 나머지를 받는다. 이 트레이스는 15360/4 와 48/4 가 딱 나눠져
      regular 와 last 가 같은 값이지만, **식은 다르다**.

substitutions:

  # ------------------------------------------------------------------ 계열 A
  - sub_id: k3-kda-nchunk
    status: proposed              # R1~R3 뒤에 accepted 로 올린다
    family: A
    phases: [prefill]
    match:
      module_regex: '\.self_attn$'
      op_type: exp
      shape: ["B", "n_h_kda", "5", "d_chunk", "d_head_kda"]
      fields: [input_shape, output_shape]
      shape_index: 0
      axis: 2
    from: "5"
    to: "n_chunk"
    identity: "n_chunk = T / d_chunk = 320 / 64 = 5"
    evidence:
      - file: "fla/ops/kda/naive.py"
        lines: "108-109"
        claim: >
          naive_chunk_kda 가 T 를 NT = T//BT 개 청크로 쪼갠다 (BT = chunk_size, 기본 64).
          따라서 [B, n_h_kda, ?, d_chunk, d_head_kda] 의 축 2 는 청크 개수다.
      - file: "src/build_table.py"
        lines: "1250"
        claim: >
          _MERGE_IDENTITY_EQUIVALENTS = {"T": {"d_chunk*n_chunk"}} -- 트레이서가 이미
          T == d_chunk*n_chunk 를 등재하고 있다. 이름만 이 자리에 안 붙었다.
      - file: "models/moonshotai__Kimi-K3/prefill.csv"
        lines: "3168 cells"
        claim: >
          **발행본이 자기모순이었다.** 같은 축을 곱 안에서는 이미 `n_chunk` 로 쓴다 --
          `B*n_h_kda*n_chunk` 가 3,168 자리(1,056 행)에 있다. 단독으로 나올 때만 `5` 로
          남았다. 이 증거는 내 판단이 아니라 **산출물 자신**에서 나온다: 곱을 풀면
          B * n_h_kda * <이 축> 이고 그 <이 축> 이 곧 [B, n_h_kda, 5, d_chunk, ...] 의
          축 2 다. 두 표기가 같은 축을 가리키므로 하나가 틀렸고, 곱 쪽이 맞다.
    falsifies: >
      T=384, d_chunk=64 로 재트레이스하면 이 축의 구체값이 6 이어야 한다. 5 로 남으면 틀렸다.
    exemplars:
      must_match:
        - "prefill / model.layers.0.self_attn / exp / input_shape[0] ax2"
      must_not_match:
        # 같은 값 5 이지만 뜻이 다른 자리 -- negative control (외부 검토 지정)
        - "prefill / model.layers.* (root) / concat / [B*T, 5, d_model] ax1   (residual 누적)"
        - "prefill / self_attn / exp 가 아닌 op 의 5"
        - "원시 원장의 [B, n_h_kda, 5, d_chunk, 5] 축 4  (causal prefix -- 발행본엔 없다)"
    tracer_finding:
      status: open                # 트레이서 쪽에 결함으로 남겨 둔다
      workaround: plus_at
      note: >
        이 이름은 원래 트레이서가 냈어야 한다(항등식이 이미 등재돼 있다). +@ 적용은
        결함의 해결이 아니라 공개된 workaround 다.
    verification:
      point_verified: true        # V6 점 대입이 기계적으로 통과한다
      verified_assignments: {B: 3, T: 320, d_chunk: 64}
      semantic_evidence_verified: false
      sweep_verified: false
      validity_domain: ["T % d_chunk == 0"]
      unverified_dimensions: [T, d_chunk]

  # ------------------------------------------------------------------ 계열 C
  # residual 누적 축. **stage 를 값이 아니라 op lineage 로 판별한다**
  # (develop/plus_at_resid.py). 값으로 고르면 1,262 셀 중 216 셀만 식이 유일하다 --
  # 950 셀이 두 식, 96 셀이 세 식에 맞는다(실측).
  - sub_id: k3-residual-accum
    status: proposed
    family: C
    phases: [prefill, decode]
    matcher: residual_stage        # 일반 match: 문법으로는 표현할 수 없다
    match:
      module_regex: '^model(\.layers\.\d+)?$'
      op_types: [concat, elementwise_mul, sum, softmax, batched_matmul]
      token_axis0: {prefill: "B*T", decode: "B"}
      value_range: [2, 9]
    stages:
      # stage,자리 -> 식.  buf = concat 의 피연산자 0(버퍼 폭), mix = 그 밖
      boundary_append: {buf: b_in,    mix: b_after}
      mix_pre:         {buf: b_in,    mix: c_pre}
      mix_post:        {buf: b_after, mix: c_post}
      mix_final:       {buf: b_final, mix: c_final}
    formulas:
      b_in: "ceil(l/R_res)"
      b_after: "ceil((l+1)/R_res)"
      c_pre: "ceil(l/R_res)+1"
      c_post: "ceil((l+1)/R_res)+1"
      b_final: "ceil(L_layers/R_res)"
      c_final: "ceil(L_layers/R_res)+1"
    identity: "저장된 residual stream 수와 그 혼합 후보 수"
    evidence:
      - file: "modeling_kimi_linear.py"
        lines: "1188-1192"
        claim: "residual 저장소가 너비 0 으로 시작한다"
      - file: "modeling_kimi_linear.py"
        lines: "995-998"
        claim: "l % attn_res_block_size == 0 일 때 stream 하나를 추가한다"
      - file: "modeling_kimi_linear.py"
        lines: "1075-1087"
        claim: >
          _apply_attn_res 가 저장소와 현재 prefix 를 concat 하고 그 축으로
          score/softmax/BMM 을 수행한다. 그래서 혼합 후보 수 = 저장 수 + 1 이다.
      - file: "develop/reviews/R1-2026-09-27-codex-blind.md"
        lines: "축 3"
        claim: >
          R1(blind 독립 도출)이 같은 식에 도달했다 -- 내 판정과 별개다. 제안식을 보지 않은
          세션이 소스만 읽고 b_in/b_after/c_pre/c_post/c_final 을 같은 형태로 냈다.
    falsifies: >
      attn_res_block_size 를 다른 값으로 트레이스하면 경계 concat 이 생기는 층이 바뀌고
      이 축들의 값도 바뀌어야 한다. 안 바뀌면 식이 틀렸다.
    exemplars:
      must_match:
        - "prefill / model.layers.1 / concat / output_shape[0] ax1 -> c_pre"
        - "prefill / model / batched_matmul / input_shape[0] ax2 -> c_final"
      must_not_match:
        - "prefill / self_attn 안의 5 (KDA 청크 -- 계열 A 가 맡는다)"
        - "[B*T, 0, d_model] 의 0 (초기 빈 버퍼 -- 리터럴이 맞다)"
        - "[..., 1, ...] 의 1 (singleton -- 리터럴이 맞다)"
    limitations:
      sweep_of_R_res: >
        **R_res 를 바꾸는 sweep 은 이 치환으로 되지 않는다.** R1 이 지적한 대로
        attn_res_block_size 를 바꾸면 (a) 어느 층에서 경계 concat 이 생기는지가 바뀌고
        (b) 지금 repeat/layers 로 합쳐진 층들이 서로 다른 shape 를 갖게 되며
        (c) 일부 op 자체가 생기거나 사라진다. 즉 control flow 가 달라진다.
        축 문자를 식으로 바꾼 것은 **현재 DAG 를 정확히 기술한 것**이고, R_res sweep 을
        하려면 행을 층별로 펼치거나 다시 트레이스해야 한다.
      batch_sweep: "B 만 바꾸면 이 축의 값은 변하지 않는다 -- 그래서 B sweep 에는 무해하다"
      independence: >
        계열 A 와 달리 적용기와 독립 matcher 가 **같은 분류기를 공유한다**
        (develop/plus_at_resid.py). lineage 분류기를 두 번 쓰는 것이 실질적 독립이
        아니라고 봤다. 대신 (1) 식을 R1 이 독립 도출했고 (2) 적용기가 접힌 행의 모든
        층에서 산술로 재확인하며 (3) shape 로 뽑은 후보 완전성을 따로 검사한다.
        이 한계는 R3 재요청에 그대로 싣는다.
    verification:
      point_verified: true
      verified_assignments: {R_res: 12, L_layers: 93}
      semantic_evidence_verified: false
      sweep_verified: false
      validity_domain:
        - "이 트레이스의 층 배치(attn_res_block_size = 12, num_hidden_layers = 93)"
      unverified_dimensions: [R_res, L_layers]

