# 제 결정: **R1 을 따른다.** 제 표기(n_trace_*)에 "trace" 가 들어 있어도, 표의 축에 식을
#          적는 것 자체가 "이 분포가 모델의 것" 이라는 주장으로 읽힌다. 값은 caveat 이
#          이미 대체값이라고 밝히고 있으므로 리터럴로 두는 것이 덜 주장하는 쪽이다.
