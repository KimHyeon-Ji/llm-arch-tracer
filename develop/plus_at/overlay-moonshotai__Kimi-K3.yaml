#          균등분할값일 뿐이고(kda_shim.py:623, :636-648), `B*T*k/4` 같은 이름을 붙이면
#          shim 의 대체값이 모델 아키텍처처럼 보인다. 필요하면 아키텍처 심볼이 아니라
#          명시적인 trace_even_split_* 주석으로만 표현해야 한다.
