#         - "prefill / model.layers.1.block_sparse_moe / concat / input_shape[3] ax0 -> n_trace_last"
#       must_not_match:
#         - "prefill / 같은 concat 의 output_shape (이미 B*k*T 로 렌더돼 있다)"
#     verification:
#       point_verified: true        # V6 점 대입이 기계적으로 통과한다
#       verified_assignments: {B: 3, T: 320, k: 16, C_trace: 4}
#       semantic_evidence_verified: false
#       sweep_verified: false
#       validity_domain: ["N_route >= C_trace", "C_trace == 4"]
#       unverified_dimensions: [B, T, k, C_trace]
#

# MoE 계산을 어떻게 하라는 것인가 -- 축을 안 바꾸는 대신 여기에 적는다.
# **총량만 말할 수 있다.** 전문가별 분포는 이 트레이스로 알 수 없다.
moe_aggregate:
  what: "이 표의 MoE 전문가 행으로 FLOPs 를 계산하는 방법"
  total_routed_tokens:
    prefill: "B*T*k"          # 3*320*16 = 15360
    decode: "B*k"             # 3*16 = 48
  traced_experts: 4           # adaptation_log 의 expert_cap. 모델은 E = 896 개를 가진다
  how: >
    전문가 행을 **합쳐서** 쓰라. 한 레이어의 expert projection 총 FLOPs 는
    (총 라우팅 토큰 수) x (토큰당 전문가 projection 비용) 이고, 그 총량은 이 트레이스에
    보존된다 -- 실제로 4 x 3840 = 15360 = B*T*k 다. 개별 전문가 행의 토큰 축(3840 / 12)은
    균등분할 대체값이므로 그 값 하나로 스윕하면 안 된다.
  not_preserved:
    - "전문가별 실제 토큰 분포 (라우팅이 정한다)"
    - "레이어당 active expert 수 (트레이스는 896 중 4 개만 돌렸다)"
    - "weight traffic (896 개 전문가 가중치가 표에 없다)"
    - "cache 거동과 latency"
  caveat_stays: true

# 바꾸지 않는 것 -- V7 이 전수 보고한다
not_substituted:
  - family: C-zero
    what: "빈 residual 버퍼의 `0` 축"
    cells: 2
    # `0` 축이 허용되는 **자리**. 개수가 아니라 위치를 못 박는다 -- V9 의
    # zero_axis_only_initial_residual 이 이 목록 밖의 `0` 을 실패로 잡는다.
    # 초기 residual 버퍼의 빈 축이고 phase 당 하나씩, 둘뿐이다.
    #   [phase, op_id, field, shape_index, axis]
    allowed_zero_cells:
      - ["prefill", 1, "input_shape", 0, 1]
      - ["decode", 1, "input_shape", 0, 1]
    why: >
      B 만 스윕하면 값이 변하지 않으므로 1차 범위 밖이다. 식은 규명됐다
      (R_before = ceil(l/S), R_after = floor(l/S)+1, S = attn_res_block_size = 12,
       최종 = ceil(L/S)+1 = 9) -- 발행본 1,264 자리 전부 설명되고 불일치 0 이다.
      다만 여러 식이 같은 값을 낼 수 있어 **셀별 semantic stage 는 아직 확정하지 않았다.**
      2차에서 op lineage 로 stage(buffer_pre / mix_pre / boundary_append / buffer_post /
      mix_post / buffer_final / mix_final)를 판별해 verified 로 싣는다.
  - family: caveat
    what: "caveat 행의 MoE 토큰 축"
    why: >
      계열 B 로 식을 붙이지만 caveat 은 **지우지 않는다.** 총 expert projection FLOPs 는
      보존되나(C_trace 행의 합 = N_route) 전문가별 실제 분포·active expert 수·weight
      traffic·cache·latency 는 보존되지 않는다.
