# Read-only input for develop/rule_coverage.py.
#
# These rules use only source-fixed positions.  A target axis is always `*`;
# q/k/v-dependent widths and the two incompatible SSD 6-D layouts are omitted
# below because this matcher has no role/nth selector.
rules:
  # ---- DeepSeek MLA / V4 indexer RoPE widths ----------------------------
  # The target is the output width of an explicit split/slice.  d_nope vs d_v
  # tensors are deliberately absent: those roles can occupy the same position,
  # size, and op type, so module_class + axis_size cannot separate them.
  - name: deepseek-mla-q-rope-split-width
    module_class: '^(?:DeepseekV2Attention|DeepseekV3Attention)$'
    scope: 'self_attn$'
    shape_any:
      - ['B', '*', 'T', '*']
      - ['B', '*', '1', '*']
    axis: 3
    op_type: split_with_sizes
    axis_size: d_rope
    symbol: d_rope
    source: 'transformers 5.14.1 modeling_deepseek_v2.py:357-365 and modeling_deepseek_v3.py:419-434 split q into [nope,rope] and compressed_kv into [rank,rope] on the trailing axis'

  - name: deepseek-mla-k-rope-split-width
    module_class: '^(?:DeepseekV2Attention|DeepseekV3Attention)$'
    scope: 'self_attn$'
    shape_any:
      - ['B', 'T', '*']
      - ['B', '1', '*']
    axis: 2
    op_type: split_with_sizes
    axis_size: d_rope
    symbol: d_rope
    source: 'transformers 5.14.1 modeling_deepseek_v2.py:357-365 and modeling_deepseek_v3.py:419-434 make split output index 1 the qk_rope_head_dim component'

  - name: deepseek-v4-indexer-rope-slice-width
    module_class: '^DeepseekV4Indexer$'
    scope: 'indexer$'
    shape_any:
      - ['B', '*', 'T', '*']
      - ['B', '*', '1', '*']
    axis: 3
    op_type: slice
    axis_size: d_rope
    symbol: d_rope
    source: 'transformers 5.14.1 modeling_deepseek_v4.py:345-359 defines rope_dim and takes the trailing x[..., -rope_dim:] slice; :563-565 applies it to indexer q'

  - name: deepseek-v4-attention-rope-slice-width
    module_class: '^DeepseekV4Attention$'
    scope: 'self_attn$'
    shape_any:
      - ['B', '*', 'T', '*']
      - ['B', '*', '1', '*']
    axis: 3
    op_type: slice
    axis_size: d_rope
    symbol: d_rope
    source: 'transformers 5.14.1 modeling_deepseek_v4.py:345-359 applies interleaved RoPE only to the trailing rope_dim slice of attention tensors'

  # review/06-open-renames.md A44. DeepseekV4CSACompressor.kv_norm = DeepseekV4RMSNorm(
  # self.head_dim, ...) (:619) -- RMSNorm's declared weight only pins the TRAILING axis
  # (d_head), so the middle axis (the compressed-entry count, T // compress_rate_csa) is left to
  # value matching, and for CSA-type layers T // m_csa happens to equal d_head numerically.
  # derived_size (not axis_size): T/m_csa is a verified FORMULA (rules/derived_dims.yaml), not a
  # plain config symbol -- this is a value-vs-value comparison exactly like axis_size elsewhere in
  # this file, just against a computed expression instead of a config field. `compressor\.kv_norm$`
  # excludes the indexer's OWN kv_norm (`compressor.indexer.kv_norm`, a different module using
  # index_head_dim/c_I, already correctly resolved) -- the regex anchors on "compressor." directly
  # preceding "kv_norm", which indexer's path does not have.
  - name: deepseek-v4-csa-kv-norm-entry-count
    module_class: '^DeepseekV4CSACompressor$'
    scope: 'compressor\.kv_norm$'
    shape_any:
      - ['B', '*', 'd_head']
    axis: 1
    derived_size: 'T/m_csa'
    symbol: 'T/m_csa'
    source: 'transformers 5.14.1 modeling_deepseek_v4.py:614,619,656,673-674 -- compressed = self.kv_norm((new_kv * new_gate...).sum(dim=2)) where new_kv/new_gate = new_zeros((batch, n_windows, 2*ratio, head_dim)); n_windows = chunk_kv.shape[1] // self.compress_rate = T // m_csa is the surviving middle axis after the dim=2 sum.'

  # ---- Gated DeltaNet -----------------------------------------------------
  # torch_chunk_gated_delta_rule transposes q/k/v/beta/g to [B,H,T,*].
  - name: gdn-rank3-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '*']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5.py:264-269 transposes inputs to [B,H,T,*]; modeling_qwen3_next.py:390-395 is identical'

  - name: gdn-rank4-key-layout-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '*', 'd_head_lin_k']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5.py:264-269 names key.shape [B,num_heads,sequence_length,k_head_dim]'

  - name: gdn-rank4-value-layout-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '*', 'd_head_lin_v']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5.py:264-269 transposes value to [B,num_heads,sequence_length,v_head_dim]'

  # During the in-chunk recurrence C=1 in the current traces.  Slicing either
  # g=[B,H,C,L] or attn=[B,H,C,L,L] changes only the trailing scan axes; H stays
  # at axis 1.  The target axis is deliberately a wildcard, so this does not
  # confirm a label by first requiring that same label.
  - name: gdn-chunk-scan-rank4-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '1', '*']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:261-266,279-293 transposes to head-major order, reshapes g to [B,H,C,L], and slices only trailing scan axes'

  - name: gdn-chunk-scan-rank5-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '1', '*', '*']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:261-266,279-294 constructs the in-chunk attention recurrence as [B,H,C,L,L] and slices only trailing scan axes'

  # Torch lowers the per-[B,H,C] matmuls to rank 3 in the current B=C=1
  # traces.  Removing those singleton batch axes leaves H as the leading axis.
  - name: gdn-bmm-value-leading-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['*', 'd_chunk', 'd_head_lin_v']
    axis: 0
    axis_size: n_h_lin_v
    op_type: batched_matmul
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:265-266,280-296 keeps H as the batch axis of attn @ v_beta; lowering B=C=1 leaves [H,L,V]'

  - name: gdn-bmm-square-leading-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['*', 'd_chunk', 'd_chunk']
    axis: 0
    axis_size: n_h_lin_v
    op_type: batched_matmul
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:265,280-296 forms per-head LxL in-chunk matmuls; lowering B=C=1 leaves [H,L,L]'

  - name: gdn-loop-rank2-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*']
    axis: 1
    axis_size: n_h_lin_v
    op_type: select
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:265-266,305-316 indexes only chunk/time axes inside the per-head recurrence; a surviving [B,H] axis 1 is num_heads'

  # Chunk reshape is [B,H,C,L,K/V]; C is 1 in the current traces.
  - name: gdn-chunked-key-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '1', 'd_chunk', 'd_head_lin_k']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5.py:283-286 reshapes q/k to [B,H,C,chunk_size,k_head_dim]'

  - name: gdn-chunked-value-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '1', 'd_chunk', 'd_head_lin_v']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5.py:283-286 reshapes value to [B,H,C,chunk_size,v_head_dim]'

  - name: gdn-chunked-key-length
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', '1', '*', 'd_head_lin_k']
    axis: 3
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_qwen3_5.py:283-286 puts chunk_size at axis 3 of [B,H,C,L,K]'

  - name: gdn-chunked-value-length
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', '1', '*', 'd_head_lin_v']
    axis: 3
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_qwen3_5.py:283-286 puts chunk_size at axis 3 of [B,H,C,L,V]'

  # Recurrent state is [B,H,K,V].
  - name: gdn-state-key-width
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', '*', 'd_head_lin_v']
    axis: 2
    axis_size: d_head_lin_k
    symbol: d_head_lin_k
    source: 'transformers 5.14.1 modeling_qwen3_5.py:300-303 constructs state as [batch_size,num_heads,k_head_dim,v_head_dim]'

  - name: gdn-state-value-width
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', 'd_head_lin_k', '*']
    axis: 3
    axis_size: d_head_lin_v
    symbol: d_head_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5.py:300-303 constructs state as [batch_size,num_heads,k_head_dim,v_head_dim]'

  # The triangular in-chunk recurrence is [B,H,C,L,L].
  - name: gdn-square-scan-head
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', '*', '1', 'd_chunk', 'd_chunk']
    axis: 1
    axis_size: n_h_lin_v
    symbol: n_h_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5.py:287-297 builds and applies a chunk_size by chunk_size mask per head'

  - name: gdn-square-scan-row
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', '1', '*', 'd_chunk']
    axis: 3
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_qwen3_5.py:287-297 gives both trailing attention axes chunk_size'

  - name: gdn-square-scan-column
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', '1', 'd_chunk', '*']
    axis: 4
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_qwen3_5.py:287-297 gives both trailing attention axes chunk_size'

  # Widths that are fixed by the operation itself, even when K==V or H==L.
  # Pure q/key/value rank-4 tensors stay omitted because only role/nth tells K
  # from V there.
  - name: gdn-square-mask-first-width
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['*', 'd_chunk']
    axis: 0
    op_type: ones
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:284,303 constructs both triangular masks as torch.ones(chunk_size,chunk_size)'

  - name: gdn-square-mask-second-width
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['d_chunk', '*']
    axis: 1
    op_type: ones
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:284,303 constructs both triangular masks as torch.ones(chunk_size,chunk_size)'

  - name: gdn-recurrent-sum-value-width
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', '*']
    axis: 2
    op_type: sum
    axis_size: d_head_lin_v
    symbol: d_head_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:345-362 keeps recurrent_state [B,H,K,V] and reduces K, leaving V as the trailing output width'

  - name: gdn-recurrent-output-value-width
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape: ['B', 'n_h_lin_v', '1', '*']
    axis: 3
    op_type: zeros
    axis_size: d_head_lin_v
    symbol: d_head_lin_v
    source: 'transformers 5.14.1 modeling_qwen3_5_moe.py:337-346 allocates core_attn_out as [B,H,sequence_length,v_head_dim]'

  # ---- Mamba2 / SSD ------------------------------------------------------
  # Exact scope suffix avoids substring matches outside the mixer leaf.  A leaf
  # literally named `mixer` can still host full attention, so the shape must
  # carry SSM-specific co-axes.  C=1 in the current trace corpus.
  - name: ssd-decay-head
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '*', '1', 'd_chunk']
    axis: 1
    axis_size: n_h_ssm
    symbol: n_h_ssm
    source: 'transformers 5.14.1 modeling_falcon_h1.py:809-815 permutes A from [B,C,L,H] to [B,H,C,L]'

  - name: ssd-decay-chunk-length
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', 'n_h_ssm', '1', '*']
    axis: 3
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_falcon_h1.py:809-815 permutes A to [B,H,C,chunk_size]'

  # reshape_into_chunks yields x=[B,C,L,H,P], B/C=[B,C,L,H,N].
  #
  # `op_type: view` 로 좁혔다(2026-08-16). shape 만으로 보면 Nemotron 의 `permute(0,1,3,2,4)`
  # 출력 `[B,C,H,L,P]` 도 같은 글자로 보여서, 이 규칙이 h 와 l 이 뒤바뀐 자리를 d_chunk 로
  # 뒤집으려 했다 -- 실제로 넣어 보니 `reshape_incons` 가 136 -> 176 으로 퇴행했다.
  # `[B,C,L,H,*]` 를 **만드는** 자리는 reshape_into_chunks 의 `.reshape(...)` 하나뿐이므로
  # 생성 지점으로 제한하면 전치된 자리를 잡지 않는다. 모델 단위로 제외하지 않는 이유는
  # Nemotron 에도 진짜 `[B,C,L,H,P]` 가 있어서 정상 자리까지 버리기 때문이다.
  - name: ssd-hidden-chunk-length
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', '*', 'n_h_ssm', 'd_head_ssm']
    axis: 2
    axis_size: d_chunk
    op_type: view
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_falcon_h1.py:322-329 and 793-807 reshape hidden to [B,C,chunk_size,H,P]; narrowed to the creating reshape because a permuted [B,C,H,L,P] renders identically'

  - name: ssd-hidden-head
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', 'd_chunk', '*', 'd_head_ssm']
    axis: 3
    axis_size: n_h_ssm
    symbol: n_h_ssm
    source: 'transformers 5.14.1 modeling_falcon_h1.py:793-807 reshapes hidden to [B,C,L,num_heads,head_dim]'

  - name: ssd-state-input-chunk-length
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', '*', 'n_h_ssm', 'd_state']
    axis: 2
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_falcon_h1.py:794-807 reshapes B/C to [B,C,chunk_size,H,state_size]'

  - name: ssd-state-input-head
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', 'd_chunk', '*', 'd_state']
    axis: 3
    axis_size: n_h_ssm
    symbol: n_h_ssm
    source: 'transformers 5.14.1 modeling_falcon_h1.py:794-807 repeats B/C groups then chunks them as [B,C,L,H,N]'

  # Direct C*B contraction is (b,c,l,s,h,n).
  - name: ssd-direct-g-row
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', '*', 'd_chunk', 'n_h_ssm', 'd_state']
    axis: 2
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_falcon_h1.py:818-819 states G_intermediate shape (b,c,l,s,h,n)'

  - name: ssd-direct-g-head
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', 'd_chunk', 'd_chunk', '*', 'd_state']
    axis: 4
    axis_size: n_h_ssm
    symbol: n_h_ssm
    source: 'transformers 5.14.1 modeling_falcon_h1.py:818-819 states G_intermediate shape (b,c,l,s,h,n)'

  - name: ssd-direct-g-state-width
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', 'd_chunk', 'd_chunk', 'n_h_ssm', '*']
    axis: 5
    axis_size: d_state
    symbol: d_state
    source: 'transformers 5.14.1 modeling_falcon_h1.py:818-819 states G_intermediate shape (b,c,l,s,h,n)'

  # Chunk-boundary state is [B,C,H,P,N] in both direct and permuted families.
  - name: ssd-recurrent-state-head
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', '*', 'd_head_ssm', 'd_state']
    axis: 2
    axis_size: n_h_ssm
    symbol: n_h_ssm
    source: 'transformers 5.14.1 modeling_falcon_h1.py:830-844 produces states [B,C,H,P,N]; modeling_nemotron_h.py:542-556 returns the same order'

  - name: ssd-recurrent-state-head-width
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', 'n_h_ssm', '*', 'd_state']
    axis: 3
    axis_size: d_head_ssm
    symbol: d_head_ssm
    source: 'transformers 5.14.1 modeling_falcon_h1.py:830-844 produces states [B,C,H,P,N]; modeling_nemotron_h.py:542-556 returns the same order'

  - name: ssd-recurrent-state-state-width
    module_class: '^(?:FalconH1Mixer|Zamba2MambaMixer|GraniteMoeHybridMambaLayer|NemotronHMamba2Mixer)$'
    scope: '(?:mamba(?:_decoder\.mamba)?|mixer|ssm)$'
    shape: ['B', '1', 'n_h_ssm', 'd_head_ssm', '*']
    axis: 4
    axis_size: d_state
    symbol: d_state
    source: 'transformers 5.14.1 modeling_falcon_h1.py:830-844 produces states [B,C,H,P,N]; modeling_nemotron_h.py:542-556 returns the same order'

# Deliberately omitted from active rules:
#
# * GDN [B,H,S,*] and [B,H,C,L,*] last axes.  They are K for q/key and V
#   for value, so shape alone cannot choose.  axis_role currently identifies
#   28 such width questions: split#0/#1 => K (8), split#2 => V (20).
# * SSD [B,C,L,H,*].  The last axis is P for hidden and N for B/C, and the
#   two streams can have equal concrete widths.
# * SSD 6-D axis 3.  Direct G uses (b,c,l,s,h,n), while the permuted-family
#   state contraction uses (b,c,h,l,n,p).  Both can be elementwise_mul and
#   the current matcher has no nth/role selector.
# * segment_sum square masks.  Its first call is LxL, but the chunk-boundary
#   call is (C+1)x(C+1); op_type=ones is not a sufficient callsite selector.

  # ---- 표준 attention (Llama) --------------------------------------------
  # `module_class` 로 묶는다: `scope` 만으로는 MLA 와 GDN 까지 잡아 실측 불일치 58 /
  # 후보밖 50 이 나온다(외부 검토). `axis_size` 는 structure.yaml 의 심볼 값과 대상 축의
  # 실제 크기를 대조하므로 RoPE 반쪽(d_head/2)이 자동으로 떨어진다 -- 숫자를 규칙에
  # 박지 않아 모델마다 다시 쓸 필요가 없다. head 개수 축은 역할(q / native-kv /
  # repeated-kv)에 따라 갈리므로 여기 넣지 않는다.
  - name: llama-attention-rank4-full-width
    module_class: '^LlamaAttention$'
    scope: 'self_attn$'
    shape_any:
      - ['B', '*', 'T', '*']
      - ['B', '*', '1', '*']
      - ['B', 'T', '*', '*']
      - ['B', '1', '*', '*']
    axis: 3
    op_types: [view, transpose]
    axis_size: d_head
    symbol: d_head
    source: 'transformers 5.14.1 modeling_llama.py:259-264 -- q/k/v are view(hidden_shape).transpose(1,2); the trailing axis is head_dim in both token-major and head-major layouts'

  - name: llama-attention-repeat-kv-full-width
    module_class: '^LlamaAttention$'
    scope: 'self_attn$'
    shape_any:
      - ['B', '*', '*', 'T', '*']
      - ['B', '*', '*', '1', '*']
      - ['B', '*', '*', 'T+1', '*']
    axis: 4
    op_type: expand
    axis_size: d_head
    symbol: d_head
    source: 'transformers 5.14.1 modeling_llama.py:187-196 repeat_kv expands [B,n_kv,T,d_head] to [B,n_kv,n_rep,T,d_head]; the trailing axis stays head_dim'

  # ---- DeepSeek-V4 attention -----------------------------------------------
  # 이 계열은 qk_rope_head_dim == num_attention_heads == 64 라 d_rope 와 n_h 가 값으로 안
  # 갈린다. 층 유형이 셋(compressed_sparse / heavily_compressed / sliding)이라 scope 만으로는
  # 위험하지만, module_class 로 묶고 axis_size 로 실제 폭을 대조하면 걸러진다.
  - name: v4-attn-token-major-head
    module_class: '^DeepseekV4Attention$'
    scope: 'self_attn$'
    shape_any:
      - ['B', 'T', '*', 'd_head']
      - ['B', '1', '*', 'd_head']
    axis: 2
    axis_size: n_h
    symbol: n_h
    source: 'transformers 5.14.1 modeling_deepseek_v4.py -- attention states are viewed as [B, T, num_heads, head_dim]; axis 2 is the head count'
  - name: v4-attn-batched-matmul-head
    module_class: '^DeepseekV4Attention$'
    scope: 'self_attn$'
    shape_any:
      - ['*', 'T', 'd_head']
      - ['*', 'T', 'T']
      - ['*', 'B', 'T+1']
    axis: 0
    op_type: batched_matmul
    axis_size: n_h
    symbol: n_h
    source: 'transformers 5.14.1 modeling_deepseek_v4.py -- per-head attention matmuls carry the head count as the batch axis once B collapses'
  - name: v4-attn-rank5-head
    module_class: '^DeepseekV4Attention$'
    scope: 'self_attn$'
    shape_any:
      - ['B', '1', '*', '*', 'd_head']
    axis: 2
    axis_size: n_h
    symbol: n_h
    source: 'transformers 5.14.1 modeling_deepseek_v4.py -- the sliding/compressed attention path keeps [B, 1, num_heads, L, head_dim]'

  # 청크 스캔 루프의 길이 축. 이 한 규칙이 Qwen3.5-397B 의 125건을 닫는다 -- 루프가 chunk_size
  # 만큼 돌며 nth 만 달라지는 같은 자리라서, 앵커를 125개 쓰는 대신 규칙 하나로 접힌다.
  # axis_size 가 d_chunk(64) 와 d_head_lin_k/v(128) 를 갈라 주므로 head 폭은 안 걸린다.
  - name: gdn-chunk-scan-rank4-length
    module_class: '^(?:Qwen3NextGatedDeltaNet|Qwen3_5(?:Moe)?GatedDeltaNet)$'
    scope: 'linear_attn$'
    shape_any:
      - ['B', 'n_h_lin_v', '1', '*']
    axis: 3
    axis_size: d_chunk
    symbol: d_chunk
    source: 'transformers 5.14.1 modeling_qwen3_5.py:279-297 -- the in-chunk recurrence carries [B, H, C, chunk_size]; axis 3 is the chunk length'

  # ---- Kimi-K3 KDA (fla naive_chunk_kda) -----------------------------------
  # No module_class filter: Kimi assigns BOTH KimiDeltaAttention and KimiMLAAttention to the
  # SAME attribute name (self.self_attn), so module_classes.json records both classes under
  # the one wildcarded path "model.layers.*.self_attn" -- module_class alone cannot tell a KDA
  # layer's op from an MLA layer's. Safe anyway: every shape below has d_chunk and/or d_head_kda
  # fixed at another axis, and neither symbol ever resolves inside an MLA-type layer (KimiMLA
  # Attention never reads config.linear_attn_config) -- so the co-occurring token, not the
  # class name, is what proves KDA scope. See review/06-open-renames.md A59.
  - name: kda-chunk-scan-head-axis
    scope: 'self_attn$'
    shape_any:
      - ['B', '*', '5', 'd_chunk', 'd_head_kda']
      - ['B', '*', 'd_chunk', 'd_head_kda']
      - ['B', '*', 'd_head_kda', 'd_head_kda']
      - ['B', '*', 'd_chunk', 'd_chunk']
      - ['B', '*', '5', 'd_chunk', 'd_chunk']
      # the causal short-conv/gate path: trailing axis varies per position inside the
      # kernel_size window (bare ints, or 2*d_conv/3*d_conv) -- axis 1 is n_h_kda regardless.
      - ['B', '*', '5', '*']
      - ['B', '*', 'd_chunk']
      - ['B', '*', 'd_head_kda', 'd_chunk']
    axis: 1
    axis_size: n_h_kda
    symbol: n_h_kda
    source: 'fla/ops/kda/naive.py:115 (naive_chunk_kda) -- every q/k/v/state/score tensor in the chunked reference keeps HV (KDA head count) at axis 1 through rearrange/select/zeros/new_zeros (also naive.py:126,141,148,154,163); see rules/label_confirmed.yaml for the per-shape citations.'

  - name: kda-chunk-scan-head-axis-2
    scope: 'self_attn$'
    shape_any:
      - ['B', 'T', '*', 'd_head_kda']
      - ['B', '1', '*', 'd_head_kda']
    axis: 2
    axis_size: n_h_kda
    symbol: n_h_kda
    source: 'fla/ops/kda/naive.py:115 -- the un-chunked [B, T, H, K] layout before/after the chunk rearrange keeps H at axis 2.'

  - name: kda-chunk-scan-head-axis-3
    scope: 'self_attn$'
    shape_any:
      - ['B', '5', 'd_chunk', '*', 'd_head_kda']
    axis: 3
    axis_size: n_h_kda
    symbol: n_h_kda
    source: 'fla/ops/kda/naive.py:115 -- a permuted variant of the [B,H,NT,BT,K] chunk layout with H and NT swapped.'

  - name: kda-chunk-scan-head-axis-0
    scope: 'self_attn$'
    shape_any:
      - ['*', 'd_chunk', 'd_head_kda']
      - ['*', 'B']
    axis: 0
    axis_size: n_h_kda
    symbol: n_h_kda
    source: 'fla/ops/kda/naive.py:148 -- HV is the leading (batch-of-matmuls) axis in naive_chunk_kda''s per-chunk-step slices onward, the batch dim already consumed by an outer index.'

  # b_proj = nn.Linear(hidden_size, num_heads) (modeling_kimi_linear.py:529) -- its weight is
  # [num_heads, hidden_size]; as a matmul OPERAND (transposed) that renders [hidden_size,
  # num_heads] = [d_model, n_h_kda].
  - name: kda-b-proj-operand-head-axis
    scope: 'self_attn\.b_proj$'
    shape_any:
      - ['d_model', '*']
    axis: 1
    axis_size: n_h_kda
    symbol: n_h_kda
    source: 'modeling_kimi_linear.py:529 -- b_proj = nn.Linear(hidden_size, num_heads); operand layout is [d_model, n_h_kda].'

  - name: kda-chunk-scan-head-dim-trailing
    scope: 'self_attn$'
    shape_any:
      - ['B', 'n_h_kda', '5', 'd_chunk', '*']
      - ['B', 'n_h_kda', 'd_chunk', '*']
    axis: 4
    axis_size: d_head_kda
    symbol: d_head_kda
    source: 'fla/ops/kda/naive.py:115,148 naive_chunk_kda -- the trailing feature axis (K, the qk-head width) after rearrange/select.'

  # S = k.new_zeros(B, HV, K, V) (naive.py:141) is genuinely K x V, not a coincidental square --
  # KDA sets V = K = head_dim (:607). Two rules, one per axis, since a rule targets one axis.
  - name: kda-recurrent-state-key-axis
    scope: 'self_attn$'
    shape_any:
      - ['B', 'n_h_kda', '*', 'd_head_kda']
    axis: 2
    axis_size: d_head_kda
    symbol: d_head_kda
    source: 'fla/ops/kda/naive.py:141,607 -- S = k.new_zeros(B, HV, K, V), K axis; genuine square (K==V by construction), not a mislabel.'

  - name: kda-recurrent-state-value-axis
    scope: 'self_attn$'
    shape_any:
      - ['B', 'n_h_kda', 'd_head_kda', '*']
    axis: 3
    axis_size: d_head_kda
    symbol: d_head_kda
    source: 'fla/ops/kda/naive.py:141,607 -- S = k.new_zeros(B, HV, K, V), V axis; genuine square (K==V by construction), not a mislabel.'
