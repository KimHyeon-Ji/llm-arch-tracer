schema_version: 1
what: 본표를 바꾸지 않는 축의 식. 본표에는 리터럴이 그대로 있고 여기에 canonical cell 별 stage 와 식이 있다.
symbols:
  R_res:
    kind: architecture
    expr: config.text_config.attn_res_block_size
    value: 12
  L_layers:
    kind: architecture
    expr: config.text_config.num_hidden_layers
    value: 93
  l: 그 행의 layer_idx. 접힌 행에서는 expand(layers) 의 모든 층에서 식이 같은 값을 낸다
formulas:
  b_in: ceil(l/R_res)
  b_after: ceil((l+1)/R_res)
  c_pre: ceil(l/R_res)+1
  c_post: ceil((l+1)/R_res)+1
  b_final: ceil(L_layers/R_res)
  c_final: ceil(L_layers/R_res)+1
limitations:
  sweep_of_R_res: 'attn_res_block_size 를 바꾸면 경계 concat 이 생기는 층, 행 접힘, op 존재 자체가 달라진다(control
    flow). 이 사이드카는 **현재 DAG 를 기술**할 뿐이고 R sweep 은 재트레이스가 필요하다.

    '
  batch_sweep: B 만 바꾸면 이 값은 변하지 않는다
cells: 1262
