# raw aten -> op_type 매핑 규칙표. src/normalize.py가 읽는다.
# 확장 방법: 02-new-module-handling.md의 Tier 2/3에서 새 op 의미를 확인하면 여기에 추가.
# exact: 완전히 일치하는 raw_op 이름
# contains: raw_op 문자열에 이 부분 문자열이 포함되면 매칭 (순서대로 검사, 첫 매치 사용)

exact:
  aten.addmm.default: linear
  aten.mm.default: matmul
  aten.bmm.default: batched_matmul
  aten.matmul.default: matmul
  aten.linear.default: linear
  aten.embedding.default: embedding
  aten.native_layer_norm.default: layernorm
  aten._softmax.default: softmax
  aten.silu.default: silu
  aten.gelu.default: gelu
  aten.sigmoid.default: sigmoid   # DeepSeek-V3 MoE router gating(aux-loss-free) 등에서 사용 (Phase 9)
  aten.mul.Tensor: elementwise_mul
  aten.add.Tensor: elementwise_add
  aten.rsqrt.default: rsqrt
  aten.mean.dim: mean
  aten.pow.Tensor_Scalar: pow
  aten.cat.default: concat
  aten.index_select.default: gather
  aten.topk.default: topk
  aten.sort.default: sort
  aten.scatter_add.default: scatter_add
  aten.tanh.default: tanh   # Gemma-2류 logit soft-capping에서 사용 (develop phase 5 참고)
  # 아래는 Phase 2~3(Llama/Qwen)에서 매 모델 반복 관측된 표준 PyTorch aten op들. 의미가
  # 모델 무관하게 확정적이라 매핑(P1 위반 아님 -- 추측이 아닌 표준 op 의미). RoPE 계열은
  # cos/sin/neg + rotate_half 패턴에서 나온다.
  aten._safe_softmax.default: softmax   # 완전 마스킹 행을 안전 처리하는 softmax 변형
  aten.cos.default: cos                 # RoPE
  aten.sin.default: sin                 # RoPE
  aten.neg.default: neg                 # RoPE rotate_half
  aten.mul.Scalar: elementwise_mul      # 스칼라 곱 (mul.Tensor와 동일 의미 계열)
  aten._grouped_mm.default: grouped_matmul  # MoE 배치 expert FFN (E개 expert를 한 번에). Phase 4 OLMoE 확인
  aten.convolution.default: conv1d          # DeltaNet/Mamba류 causal short conv (Phase 16 Qwen3-Next 확인)
  aten.exp.default: exp                      # gate/감쇠 계수 (DeltaNet, Mamba SSM)
  aten.cumsum.default: cumsum                # 누적합(스캔/라우팅). Phase 16/17

contains:
  scaled_dot_product: sdpa
  rms_norm: rmsnorm
