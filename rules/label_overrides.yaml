    source: 같은 행의 입력이 [B,1,d_chunk,n_h_ssm,d_chunk,1] 이고 마지막 축만 축약된다.
  - model: nvidia__NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    module: 'mixer$'
    op_type: sum
    nth: 0
    field: i
    shape: ['B', '1', 'd_state', 'd_chunk', 'n_h_ssm', 'd_head']
    axis: 2
    from: d_state
    to: d_chunk
    expect: 128
    spread: class
    source: 같은 행의 출력이 [B,1,d_chunk,d_chunk,n_h_ssm] 다.
  - model: nvidia__NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    module: 'mixer$'
    op_type: sum
    nth: 1
    field: o
    shape: ['B', '1', 'd_state', 'd_chunk', 'n_h_ssm']
    axis: 2
    from: d_state
    to: d_chunk
    expect: 128
    spread: class
    source: 같은 행의 입력이 [B,1,d_chunk,d_chunk,n_h_ssm,1] 이고 마지막 축만 축약된다.

  # ============================================================================
  # 2차 라운드 J1~J3 — GLM-5.2. J1 은 신규 지적이고 자체 모순이 4행 안에 있다:
  #   q_b_proj  t/matmul  [n_h*d_v, c_q]
  #   self_attn view      [B,T,n_h*d_v] -> [B,T,n_h,d_v]
  #   self_attn split     [B,n_h,T,d_v] -> [B,n_h,T,d_nope] * [B,n_h,T,d_rope]
  # 즉 d_v = d_nope + d_rope 인데 query 폭을 value 폭 이름으로 부르고 있다.
  # 소스도 같은 말을 한다: modeling_glm_moe_dsa.py:327 query 는 qk_head_dim 이다.
  # (1차의 J-3 key-cache 건과는 다른 자리다 -- 그건 캐시 key 라 여전히 open.)
  # ============================================================================
  - model: zai-org__GLM-5.2
    module: 'q_b_proj$'
    from: 'n_h*d_v'
    to: 'n_h*(d_nope+d_rope)'
    expect: 16384
    spread: class
    source: >
      modeling_glm_moe_dsa.py:327-340 -- query 는 qk_head_dim(= qk_nope_head_dim +
      qk_rope_head_dim) 폭이다. 같은 모델의 split 이 이 폭을 d_nope 와 d_rope 로 가른다.
  - model: zai-org__GLM-5.2
    module: 'self_attn$'
    op_type: view
    field: o
    shape: ['B', 'T', 'n_h', 'd_v']
    axis: 3
    from: d_v
    to: 'd_nope+d_rope'
    expect: 256
    spread: class
    source: >
      바로 아래 split 이 [B,n_h,T,d_v] -> [B,n_h,T,d_nope] * [B,n_h,T,d_rope] 다.
      query per-head 폭은 d_nope+d_rope 다 (prefill).
  - model: zai-org__GLM-5.2
    module: 'self_attn$'
    op_type: view
    field: o
    shape: ['B', '1', 'n_h', 'd_v']
    axis: 3
    from: d_v
    to: 'd_nope+d_rope'
    expect: 256
    spread: class
    source: 위와 같다 (decode).

  # J2/J3 compressed-KV split 의 둘째 조각. Kimi H1 과 같은 자체 모순:
  #   split_with_sizes [B,T,c_kv+d_rope] -> [B,T,c_kv] * [B,T,n_h]
  - model: zai-org__GLM-5.2
    module: 'self_attn$'
    op_type: transpose
    nth: 0
    field: o
    axis: 3
    from: d_v
    to: 'd_nope+d_rope'
    expect: 256
    source: >
      같은 행의 입력이 [B,T,n_h,d_nope+d_rope] 다. 전치는 축 이름을 바꿀 수 없다.
      query 경로이므로 qk_head_dim 폭이다 (modeling_glm_moe_dsa.py:327).
  - model: zai-org__GLM-5.2
    module: 'self_attn$'
    op_type: split_with_sizes
    field: i
    shape: ['B', 'n_h', 'T', 'd_v']
    axis: 3
    from: d_v
    to: 'd_nope+d_rope'
    expect: 256
    source: >
      같은 행의 출력이 [B,n_h,T,d_nope] * [B,n_h,T,d_rope] 다. 입력 폭은 그 합이다.
  - model: zai-org__GLM-5.2
    module: 'self_attn$'
    op_type: split_with_sizes
    field: i
    shape: ['B', 'n_h', '1', 'd_v']
    axis: 3
    from: d_v
    to: 'd_nope+d_rope'
    expect: 256
    source: 위와 같다 (decode).

  # 2차 라운드 J4/J5 — GLM-5.2 indexer 의 **key 경로**. query 경로([B,T,n_h_I,c_I])는
  # 1차에서 이미 [.., d_rope] / [.., c_I-d_rope] 로 맞게 고쳐졌고, key 경로([B,T,1,c_I])만
  # 남았다. 소스 modeling_glm_moe_dsa.py:236-242 가 q/k 를 같은 방식으로 split 한다:
  #   k_rot, k_pass = torch.split(k, [qk_rope_head_dim, head_dim - qk_rope_head_dim], dim=-1)
  # 첫 조각 d_rope, 둘째 c_I-d_rope. 합치는 concat 은 d_rope/2 두 조각 -> d_rope.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: split_with_sizes
    field: o
    shape_index: 0
    shape: ['B', 'T', '1', 'n_h']
    axis: 3
    from: n_h
    to: d_rope
    expect: 64
    source: modeling_glm_moe_dsa.py:236-242 -- split 첫 조각은 qk_rope_head_dim.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: split_with_sizes
    field: o
    shape_index: 1
    shape: ['B', 'T', '1', 'n_h']
    axis: 3
    from: n_h
    to: 'c_I-d_rope'
    expect: 64
    source: modeling_glm_moe_dsa.py:236-242 -- 둘째는 head_dim - qk_rope_head_dim.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: concat
    field: o
    shape: ['B', 'T', '1', 'n_h']
    axis: 3
    from: n_h
    to: d_rope
    expect: 64
    source: 같은 행의 두 피연산자가 d_rope/2 다. 합치면 d_rope.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: concat
    field: i
    shape: ['B', 'T', '1', 'n_h_I']
    axis: 3
    from: n_h_I
    to: 'd_rope/2'
    expect: 32
    source: interleaved RoPE 의 절반 조각이다. n_h_I 는 헤드 개수라 폭이 될 수 없다.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: slice
    field: i
    shape: ['B', 'T', '1', 'n_h']
    axis: 3
    from: n_h
    to: d_rope
    expect: 64
    source: 같은 행의 출력이 [.., d_rope/2] 다. 자르기 전 폭은 d_rope.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: split_with_sizes
    field: o
    shape_index: 0
    shape: ['B', '1', '1', 'n_h']
    axis: 3
    from: n_h
    to: d_rope
    expect: 64
    source: modeling_glm_moe_dsa.py:236-242 -- split 첫 조각은 qk_rope_head_dim.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: split_with_sizes
    field: o
    shape_index: 1
    shape: ['B', '1', '1', 'n_h']
    axis: 3
    from: n_h
    to: 'c_I-d_rope'
    expect: 64
    source: modeling_glm_moe_dsa.py:236-242 -- 둘째는 head_dim - qk_rope_head_dim.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: concat
    field: o
    shape: ['B', '1', '1', 'n_h']
    axis: 3
    from: n_h
    to: d_rope
    expect: 64
    source: 같은 행의 두 피연산자가 d_rope/2 다. 합치면 d_rope.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: concat
    field: i
    shape: ['B', '1', '1', 'n_h_I']
    axis: 3
    from: n_h_I
    to: 'd_rope/2'
    expect: 32
    source: interleaved RoPE 의 절반 조각이다. n_h_I 는 헤드 개수라 폭이 될 수 없다.
  - model: zai-org__GLM-5.2
    module: 'indexer$'
    op_type: slice
    field: i
    shape: ['B', '1', '1', 'n_h']
    axis: 3
    from: n_h
    to: d_rope
    expect: 64
    source: 같은 행의 출력이 [.., d_rope/2] 다. 자르기 전 폭은 d_rope.

  # ============================================================================
  # 미검토 모델 정리 — DeepSeek-V4-Pro. Codex 패킷(28개)에 포함된 적이 없어 두 라운드 다
  # 검토받지 못했다. 위반은 V4-Flash 의 F-4 와 **완전히 같은 패턴**이고, 1차에서 내가
  # 엔트리를 V4-Flash 2종으로만 한정해 놓쳤다.
  #   transpose [T, T/m_hca, n_h*d_head/g_o] -> [g_o, T, n_h*d_head/g_o]   (122행)
  # T/m_hca = g_o = 8 충돌. 전치는 축 이름을 바꿀 수 없고, 같은 행의 출력이 이미 g_o 다.
  # ============================================================================
  - model: deepseek-ai__DeepSeek-V4-Pro
    module: 'o_a_proj$'
    op_type: transpose
    field: i
    axis: 1
    from: 'T/m_hca'
    to: g_o
    expect: 16
    spread: class
    source: >
      modeling_deepseek_v4.py:326-332 -- o_a_proj 의 이 축은 n_groups(g_o)다.
      aten.transpose 는 축 이름을 바꿀 수 없는데 같은 행의 출력이 이미 g_o 다.
      V4-Flash / V4-Flash-0731 에 이미 같은 판정이 반영돼 있다.

  # ============================================================================
  # 미검토 모델 정리 — Kimi-K3. Codex 패킷(28개)에 포함된 적이 없어 두 라운드 다 미검토.
  # n_h = n_h_kda = 96, d_v = d_head_kda = 128 로 완전 충돌이라 값으로는 구분 불가.
  # KDA 경로의 conv 채널 축에 MLA 심볼(n_h*d_v)이 붙었다. 같은 행의 출력이 이미
  # n_h_kda*d_head_kda 라고 말한다(전치 불변식 위반 207행).
  #   transpose [B, n_h*d_v, T] -> [B, T, n_h_kda*d_head_kda]
  # **KDA 전용 서브모듈로만 한정한다** -- bare self_attn 은 MLA 레이어와 섞여 있어
  # 거기서는 n_h*d_v 가 정당할 수 있다.
  # ============================================================================
  - model: moonshotai__Kimi-K3
    module: 'self_attn\.(q|k|v)_conv1d'
    from: 'n_h*d_v'
    to: 'n_h_kda*d_head_kda'
    expect: 12288
    spread: class
    source: >
      KDA(Kimi Delta Attention) 경로의 depthwise conv 다. 채널 축은 KDA 헤드 폭
      (n_h_kda * d_head_kda)이고, 같은 행의 출력이 이미 그렇게 렌더링돼 있다.
      MLA 쪽 심볼(n_h*d_v)은 값이 같아 가려졌을 뿐이다.

  # ============================================================================
  # 3차 라운드 G1/G2 — V4-Flash-0731 의 indexer RoPE 과잉 치환. **내가 만든 결함이다.**
  # 2차에서 넣은 slice 엔트리(shape ['B','n_h_I','T','n_h'] -> c_I-d_rope, spread: class)가
  # 이 모델에서는 **앞/뒤 두 slice 를 하나의 등가류로 묶어** 회전되는 뒤쪽 조각까지
  # c_I-d_rope 로 바꿨다. 같은 엔트리가 V4-Flash 에서는 정확히 갈렸다(모델별로 등가류
  # 구성이 다르다 -- shape 만으로는 보장되지 않는다).
  #   F: prefill nth=20 -> c_I-d_rope, nth=21 -> d_rope   (정확)
  #   G: prefill nth=20 -> c_I-d_rope, nth=21 -> c_I-d_rope (틀림)
  # nth 로 뒤쪽 조각만 되돌린다.
  # ============================================================================
  - model: deepseek-ai__DeepSeek-V4-Flash-0731
    module: 'indexer$'
    op_type: slice
    nth: 21
    field: o
    axis: -1
    from: 'c_I-d_rope'
    to: d_rope
    expect: 64
    spread: class
    source: >
      modeling_deepseek_v4.py:356-359 -- nope, rope = x[..., :-rope_dim], x[..., -rope_dim:]
      이후 cat([nope, rotated]). **뒤쪽 조각만 회전되며 폭은 rope_dim(d_rope)** 이다.
      앞쪽(nth=20)은 c_I-d_rope 가 맞으므로 그대로 둔다.
  - model: deepseek-ai__DeepSeek-V4-Flash-0731
    module: 'indexer$'
    op_type: slice
    nth: 3
    field: o
    axis: -1
    from: 'c_I-d_rope'
    to: d_rope
    expect: 64
    spread: class
    source: 위와 같다 (decode, 앞쪽은 nth=2).

  # ============================================================================
  # 3차 라운드 K1~K9 — Kimi-K3. K1 은 내 2차 엔트리의 스코프 실수($ 로 .conv 서브모듈
  # 제외)라 위에서 고쳤다. 아래는 나머지.
  # ============================================================================

  # K2 청크 스캔 루프의 prefix 폭이 우연히 d_conv(4)로 이름 붙었다.
  #   sum [B,n_h_kda,5,d_chunk,4] -> [B,n_h_kda,5,d_conv]
  # fla/ops/kda/naive.py:134-136 의 `for i in range(1, BT)` 에서 A[..., i, :i] 의 prefix 다.
  # conv 커널 폭과는 무관하고 값이 4 로 같을 뿐이다.
  - model: moonshotai__Kimi-K3
    module: 'self_attn$'
    shape: ['B', 'n_h_kda', '5', 'd_conv']
    axis: 3
    from: d_conv
    to: '4'
    expect: 4
    spread: class
    source: >
      fla/ops/kda/naive.py:134-136 -- for i in range(1, BT) 안의 A[..., i, :i] 로,
      이 축은 루프 prefix 길이다. d_conv(=4)와는 값만 같다.

  # K3/K4 KDA 게이트 투영. 같은 모듈의 뒤 행이 이미 [B,1,n_h_kda,d_head_kda] 로 되접는다.
  - model: moonshotai__Kimi-K3
    module: 'f_b_proj$'
    from: 'n_h*d_v'
    to: 'n_h_kda*d_head_kda'
    expect: 12288
    spread: class
    source: >
      modeling_kimi_linear.py:523-524,601-607 -- f_b_proj(..., projection_size) 이후
      KDA 가 h, d = self.head_dim 으로 재배열한다. 같은 모듈의 view 가 이미
      [B,1,n_h_kda,d_head_kda] 로 되접는다.
  - model: moonshotai__Kimi-K3
    module: 'g_proj$'
    from: 'n_h*d_v'
    to: 'n_h_kda*d_head_kda'
    expect: 12288
    spread: class
    source: >
      modeling_kimi_linear.py:651-658 -- KDA gate 를 d = self.head_dim 으로 재배열한 뒤
      KDA 출력에 적용한다.

  # K5~K9 MLA value 경로. **decode 만 틀렸다**(prefill 은 이미 d_v 로 정확하다):
  #   split_with_sizes [B,n_h,1,d_nope+d_v] -> [B,n_h,1,d_nope] * [B,n_h,1,d_nope]
  # 입력이 d_nope+d_v 이고 첫 조각이 d_nope 이므로 둘째는 d_v 다. 자체 모순.
  - model: moonshotai__Kimi-K3
    module: 'self_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h', 'T', 'd_nope']
    axis: 3
    from: d_nope
    to: d_v
    expect: 128
    spread: class
    source: >
      modeling_kimi_linear.py:454-458 / eager_attention_forward:330 -- 확률 x value 의
      결과는 value 의 마지막 축을 보존한다. 같은 행의 출력이 이미 d_v 다.

  # ============================================================================
  # 3차 라운드 K10~K21 — DeepSeek-V4-Pro. 세 값 충돌이 원인이다:
  #   T/m_hca = g_o = n_hc*n_hc = 16 / n_h_I = d_rope = c_I-d_rope = 64 / d_head = T/m_csa = 512
  # 아래는 **행 안에서 자체 모순이 확인되는 것**부터 반영한다.
  # ============================================================================

  # K10 mHC combine 폭. split 이 (2+n_hc)*n_hc 를 [n_hc, n_hc, 나머지] 로 가르므로
  # 나머지는 n_hc*n_hc 다. 바로 뒤 view 가 [.., n_hc, n_hc] 로 되접어 확인해 준다.
  - model: deepseek-ai__DeepSeek-V4-Pro
    module: 'attn_hc$'
    from: 'T/m_hca'
    to: 'n_hc*n_hc'
    expect: 16
    spread: class
    source: >
      modeling_deepseek_v4.py:915-942 -- split 크기는 [hc, hc, hc*hc] 이고 이후
      comb_w.view(..., hc, hc) 로 되접는다. 같은 행의 view 가 [.., n_hc, n_hc] 다.

  # K16 sliding-window 캐시 길이. concat 이 (w_local-1) + 1 을 이어붙이므로 w_local 이다.
  - model: deepseek-ai__DeepSeek-V4-Pro
    module: 'self_attn$'
    op_type: concat
    field: o
    shape: ['B', '1', 'n_h', 'd_head']
    axis: 2
    from: n_h
    to: w_local
    expect: 128
    spread: class
    source: >
      modeling_deepseek_v4.py:197,204-216 -- 캐시는 sliding_window 로 유지되고 sequence
      축에서 concat/slice 한다. 같은 행의 피연산자가 [.., w_local-1, ..] 와 [.., 1, ..] 다.

  # K21 sliding KV 뒤에 compressed_kv 를 잇는 concat. 출력이 w_local + T/m_csa 라고
  # 말하므로 두 피연산자는 각각 w_local 과 T/m_csa 다.
  - model: moonshotai__Kimi-K3
    module: 'self_attn$'
    op_type: view
    field: i
    shape: ['B', 'n_h', 'T', 'd_nope', '1']
    axis: 3
    from: d_nope
    to: d_v
    expect: 128
    spread: class
    source: >
      modeling_kimi_linear.py:430-433 -- attention 출력은 value 폭을 보존한다.
      같은 행의 출력이 이미 d_v 다.
  - model: moonshotai__Kimi-K3
    module: 'self_attn$'
    op_type: view
    field: i
    shape: ['B', 'n_h', '1', 'd_nope', '1']
    axis: 3
    from: d_nope
    to: d_v
    expect: 128
    spread: class
    source: modeling_kimi_linear.py:430-433 -- 위와 같다 (decode).

  # Kimi-K3: view [B,T,n_h,d_v] -> [B,T,n_h_kda*d_head_kda]
  #   평탄화된 축은 이미 KDA 심볼인데 되접기 전 (n_h, d_v) 쌍이 MLA 심볼로 남았다.
  - model: moonshotai__Kimi-K3
    module: 'self_attn$'
    op_type: view
    field: i
    shape: ['B', 'T', 'n_h', 'd_v']
    axis: 2
    from: n_h
