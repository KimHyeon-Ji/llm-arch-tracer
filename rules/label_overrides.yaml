      modeling_qwen3_next.py:747 self.down_proj = nn.Parameter(torch.empty(self.num_experts,
      self.hidden_dim, self.intermediate_dim)) -- 마지막 축은 moe_intermediate_size.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: transpose
    field: i
    shape_index: 0
    axis: 0
    from: d_moe
    to: E
    expect: 512
    spread: class
    source: modeling_qwen3_next.py:743-747 -- 전치 입력은 원본 파라미터, 첫 축 num_experts.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: transpose
    field: i
    shape_index: 0
    axis: 2
    from: E
    to: d_moe
    expect: 512
    source: modeling_qwen3_next.py:747 -- down_proj 원본의 마지막 축은 intermediate.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: transpose
    field: o
    shape_index: 0
    axis: 0
    from: d_moe
    to: E
    expect: 512
    spread: class
    source: modeling_qwen3_next.py:743-747 -- 전치는 축 0 을 건드리지 않는다.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: transpose
    field: o
    shape_index: 0
    axis: 1
    from: E
    to: d_moe
    expect: 512
    source: modeling_qwen3_next.py:747 -- transpose(1,2) 후 intermediate 가 축 1 로 온다.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: grouped_matmul
    field: w
    axis: 0
    from: d_moe
    to: E
    expect: 512
    source: modeling_qwen3_next.py:743-747 -- 첫 축은 num_experts.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: grouped_matmul
    field: w
    axis: 2
    from: E
    to: d_moe
    expect: 512
    source: modeling_qwen3_next.py:747 -- down_proj 원본 마지막 축은 intermediate.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: grouped_matmul
    field: i
    shape_index: 1
    axis: 1
    from: E
    to: d_moe
    expect: 512
    source: modeling_qwen3_next.py:747 -- 전치된 down_proj 의 축 1 은 intermediate.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'mlp\.experts$'
    op_type: grouped_matmul
    field: i
    shape_index: 2
    axis: 0
    from: d_moe
    to: E
    expect: 512
    spread: class
    source: >
      _grouped_mm 의 세 번째 피연산자는 그룹 크기 텐서로 길이 = num_experts. 같은 op 을 쓰는
      MiniMaxAI__MiniMax-M2 는 이 자리를 이미 [E] 로 정확히 렌더링한다.

  # A-6 Qwen3-Next 청크 마스크. linear attention 에는 RoPE 가 없다. linear_attn 안의
  # d_rope 는 ones/triu/eye/masked_fill/elementwise_add 에만 등장(실측 252건) -- 전부 오류.
  # 밖의 정당한 d_rope(self_attn 264, rotary_emb 15)는 스코프로 보호된다.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'linear_attn$'
    from: d_rope
    to: d_chunk
    expect: 64
    source: >
      modeling_qwen3_next.py:413,423,432 torch.triu(torch.ones(chunk_size, chunk_size, ...))
      / torch.eye(chunk_size, ...) -- 두 축 모두 chunk_size.

  # A-7 Qwen3-Next decode: transpose 는 축 이름을 바꿀 수 없는데 입력이 d_head_lin_k,
  # 출력이 d_head_lin_v 였다. 이 텐서는 recurrent delta-rule 의 core_attn_out(value 계보)
  # 이므로 입력 쪽이 틀렸다. 생산자인 zeros 도 같은 텐서라 함께 고친다.
  # (q/k 의 transpose 는 입력 shape 이 [B, 1, n_h_lin_v, ·] 로 순서가 달라 안 걸린다.)
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'linear_attn$'
    op_type: zeros
    field: o
    shape: ['B', 'n_h_lin_v', '1', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: >
      위 transpose 의 생산자. core_attn_out 버퍼이므로 value head 폭이다.

  # A-8 OLMo-2. k/v 는 num_key_value_heads 를 읽는다. 이 모델은 MHA(n_h == n_kv == 32)라
  # 둘 다 4096 이어서 숫자로는 영원히 안 잡힌다. k_norm 도 같은 필드를 읽으므로 포함한다
  # (q_proj/q_norm 은 num_attention_heads 이므로 스코프 밖 -- 건드리면 안 된다).
  - model: allenai__OLMo-2-1124-7B-Instruct
    module: 'self_attn\.(k_proj|v_proj|k_norm)$'
    from: 'n_h*d_head'
    to: 'n_kv*d_head'
    expect: 4096
    spread: class
    source: >
      modeling_olmo2.py:223-227,233 self.k_proj = nn.Linear(config.hidden_size,
      config.num_key_value_heads * self.head_dim, ...) / 동 v_proj /
      self.k_norm = Olmo2RMSNorm(config.num_key_value_heads * self.head_dim, ...)

  # A-7b prefill 짝. A-7 은 shape 에 decode 의 축 '1' 을 박아 decode 만 고쳤고, prefill 은
  # 그 자리가 'T' 라 매치되지 않아 36행이 남았다(전치 불변식 전수 검사로 발견, 2026-09-03).
  # prefill 은 생산자 사슬이 zeros 하나가 아니라 slice 를 거쳐 길어서, 자리별 엔트리 대신
  # 등가류 모드로 텐서 전체를 한 이름으로 맞춘다.
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', 'T', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: >
      aten.transpose 는 축을 재배열만 한다 -- 입력 [B, n_h_lin_v, T, d_head_lin_k] 가
      출력 [B, T, n_h_lin_v, d_head_lin_v] 로 나올 수 없다. 이 텐서는 recurrent
      delta-rule 의 core_attn_out 으로 value 계보이므로 입력 쪽이 틀렸다.

  # ============================================================================
  # 배치 B — Codex CSV/JSONL 검토(2026-09-02) 판정 9건. 전건 실제 CSV 행 + 설치된
  # transformers 5.14.1 소스로 대조. 근거 전문: develop/verdicts_csvjsonl_batchB.md
  # ============================================================================

  # B-1 Qwen3.5-397B fused-Q. A-4(Qwen3-Next)와 같은 결함. n_kv*d_head=2*256=512,
  # 2*d_head=512 로 충돌. [B,T,n_kv,d_head] 로 되접는 k/v view 는 shape 이 달라 제외된다.
  - model: Qwen__Qwen3.5-397B-A17B
    module: 'self_attn$'
    shape: ['B', 'T', 'n_h', 'n_kv*d_head']
    axis: -1
    from: 'n_kv*d_head'
    to: '2*d_head'
    expect: 512
    source: >
      modeling_qwen3_5_moe.py:658-665 q_proj = nn.Linear(hidden, num_attention_heads*head_dim*2)
      이후 view(*input_shape, -1, head_dim*2) 로 되접으므로 마지막 축은 head_dim*2.

  # B-2 Qwen3.5-397B: 같은 모듈의 ones 는 이미 [d_chunk,d_chunk] 로 정확한데 eye 만
  # 첫 축이 n_h_lin_v(64) 로 갈렸다. d_chunk 도 64 라 숫자로는 불검출.
  - model: Qwen__Qwen3.5-397B-A17B
    module: 'linear_attn$'
    op_type: eye
    field: o
    shape: ['n_h_lin_v', 'd_chunk']
    axis: 0
    from: n_h_lin_v
    to: d_chunk
    expect: 64
    spread: class
    source: >
      modeling_qwen3_5_moe.py:294 torch.eye(chunk_size, ...) -- 두 축 모두 chunk_size.

  # B-3 Qwen3.5-397B 전치 불변식. Codex 는 decode 라 했으나 전수 검사 결과 decode 위반은
  # 0 이고 prefill 45행이다. 생산자 사슬이 길어 등가류 모드를 쓴다.
  - model: Qwen__Qwen3.5-397B-A17B
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', 'T', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: >
      aten.transpose 는 축을 재배열만 한다 -- 입력 [B,n_h_lin_v,T,d_head_lin_k] 가
      출력 [B,T,n_h_lin_v,d_head_lin_v] 로 나올 수 없다. recurrent delta-rule 의
      core_attn_out 이므로 value 계보이고 입력 쪽이 틀렸다.

  # B-4 Qwen3.5-4B: in_proj_qkv 는 이미 2*d_k_lin+d_v_lin 로 정확한데, 그 출력을 그대로
  # 받는 conv 경로가 2*n_h*d_head 로 갈린다(전치 한 행에서 입력/출력이 서로 다름).
  # self_attn 의 2*n_h*d_head 는 fused q_proj 라 정당하므로 linear_attn 으로만 한정한다
  # ($ 없음 -- linear_attn 과 linear_attn.conv1d 를 함께 덮는다).
  - model: Qwen__Qwen3.5-4B
    module: 'linear_attn'
    from: '2*n_h*d_head'
    to: '2*d_k_lin+d_v_lin'
    expect: 8192
    source: >
      같은 모델의 in_proj_qkv 가중치가 [2*d_k_lin+d_v_lin, d_model] 이고 conv 는 그 출력을
      그대로 받는다. 한 텐서에 두 이름이 붙어 있었다.

  # B-5 Qwen3.5-4B 청크 마스크. linear attention 에 RoPE 는 없다.
  - model: Qwen__Qwen3.5-4B
    module: 'linear_attn$'
    from: d_rope
    to: d_chunk
    expect: 64
    source: >
      modeling_qwen3_5.py:287,306 torch.ones(chunk_size, chunk_size) / torch.eye(chunk_size).

  # B-6 Qwen3.5-4B k/v_proj. n_h*d_rope(16*64=1024) 는 지어낸 이름이고 실제는
  # num_key_value_heads*head_dim = 4*256 = 1024. (k_norm 은 head_dim 폭이라 제외)
  - model: Qwen__Qwen3.5-4B
    module: 'self_attn\.(k_proj|v_proj)$'
    from: 'n_h*d_rope'
    to: 'n_kv*d_head'
    expect: 1024
    source: >
      modeling_qwen3_5.py:664-669 k_proj/v_proj = nn.Linear(hidden_size,
      config.num_key_value_heads * self.head_dim, ...).

  # B-7 Qwen3.5-4B 전치 불변식. Codex 는 decode 만 짚었으나 prefill 24 + decode 24 다.
  - model: Qwen__Qwen3.5-4B
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', 'T', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: aten.transpose 불변식 -- core_attn_out 은 value 계보다 (prefill).
  - model: Qwen__Qwen3.5-4B
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', '1', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: aten.transpose 불변식 -- core_attn_out 은 value 계보다 (decode).

  # B-8 OLMoE experts gate-up. A-2(MiniMax)와 같은 결함이고 2*d_moe=2*1024=2048=d_model.
  # 같은 행의 output 은 이미 [k*T, 2*d_moe] 로 맞아 자체 모순이었다.
  - model: allenai__OLMoE-1B-7B-0924
    module: 'self_attn\.(k_proj|v_proj|k_norm)$'
    from: 'n_h*d_head'
    to: 'n_kv*d_head'
    expect: 2048
    spread: class
    source: >
      modeling_olmoe.py:237-241 k_proj/v_proj = num_key_value_heads*head_dim /
      modeling_olmoe.py:247-249 k_norm = OlmoeRMSNorm((hidden_size//num_attention_heads)
      * num_key_value_heads).

  # B-6b Qwen3.5-4B: k/v 를 [B,T,n_kv,d_head] 로 되접는 bare self_attn 의 view. 입력 평탄
  # 축이 n_h*d_rope 로 남아 있었다(B-6 이 k_proj/v_proj 서브모듈만 덮었다). 되접는 결과가
  # [n_kv, d_head] 이므로 평탄 축은 n_kv*d_head 일 수밖에 없다 -- 행 자체로 자명하다.
  - model: Qwen__Qwen3.5-4B
    module: 'self_attn$'
    op_type: view
    field: i
    axis: -1
    from: 'n_h*d_rope'
    to: 'n_kv*d_head'
    expect: 1024
    source: >
      modeling_qwen3_5.py:664-669 k_proj/v_proj = num_key_value_heads*head_dim; 같은 행의
      출력이 [B, T, n_kv, d_head] 다.

  # ============================================================================
  # 배치 C — Qwen3.6 계열. 아키텍처가 Qwen3_5*ForConditionalGeneration 이라 modeling
  # 소스가 Qwen3.5 와 같고, 따라서 배치 B 와 같은 결함이 같은 자리에 있다.
  # 근거 전문: develop/verdicts_csvjsonl_batchC.md
  # ============================================================================

  # C-1 Qwen3.6-27B rotate_half. partial rotary 라 d_head/2 가 아니라 d_rope/2 다
  # (n_h+2*n_kv = 24+8 = 32 = d_rope/2 = 64/2). 이 이름은 self_attn 의 slice(128)/neg(64)/
  # concat(64) = 256행에만 있고 정당한 용례 0.
  - model: Qwen__Qwen3.6-27B
    module: 'self_attn$'
    from: 'n_h+2*n_kv'
    to: 'd_rope/2'
    expect: 32
    source: >
      modeling_qwen3_5.py:566-570 rotate_half 은 x.shape[-1]//2 를 자른다. 같은 행의 입력이
      [B, n_h, T, d_rope] 이므로(modeling_qwen3_5.py:598-600 q_rot = q[..., :rotary_dim])
      잘린 축은 d_rope/2 다.

  # C-2 Qwen3.6-27B 청크 마스크. linear attention 에 RoPE 는 없다.
  - model: Qwen__Qwen3.6-27B
    module: 'linear_attn$'
    from: d_rope
    to: d_chunk
    expect: 64
    source: modeling_qwen3_5.py:287,306 torch.ones(chunk_size, chunk_size) / torch.eye(chunk_size).

  # C-3 Qwen3.6-27B 전치 불변식 (전수 검사: 96행, 양쪽 phase).
  - model: Qwen__Qwen3.6-27B
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', 'T', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: aten.transpose 불변식 -- core_attn_out 은 value 계보다 (prefill).
  - model: Qwen__Qwen3.6-27B
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', '1', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: aten.transpose 불변식 -- core_attn_out 은 value 계보다 (decode).

  # C-4 Qwen3.6-35B conv 채널. B-4 와 동일. self_attn 의 2*n_h*d_head 는 fused q_proj 라
  # 정당하므로 linear_attn 으로만 한정한다($ 없음 -- conv1d 서브모듈 포함).
  - model: Qwen__Qwen3.6-35B-A3B
    module: 'linear_attn'
    from: '2*n_h*d_head'
    to: '2*d_k_lin+d_v_lin'
    expect: 8192
    source: >
      같은 모델의 in_proj_qkv 가중치가 [2*d_k_lin+d_v_lin, d_model] 이고 conv 는 그 출력을
      그대로 받는다. 전치 한 행에서 입력 2*d_k_lin+d_v_lin -> 출력 2*n_h*d_head 로 모순.

  # C-5 Qwen3.6-35B fused-Q. A-4/B-1 과 동일. k/v 되접기 view 는 shape 이 달라 제외된다.
  - model: Qwen__Qwen3.6-35B-A3B
    module: 'self_attn$'
    shape: ['B', 'T', 'n_h', 'n_kv*d_head']
    axis: -1
    from: 'n_kv*d_head'
    to: '2*d_head'
    expect: 512
    source: >
      modeling_qwen3_5.py q_proj = nn.Linear(hidden, num_attention_heads*head_dim*2) 이후
      view(*input_shape, -1, head_dim*2) -- 마지막 축은 head_dim*2.

  # C-6 Qwen3.6-35B 청크 마스크.
  - model: Qwen__Qwen3.6-35B-A3B
    module: 'linear_attn$'
    from: d_rope
    to: d_chunk
    expect: 64
    source: modeling_qwen3_5.py:287,306 torch.ones(chunk_size, chunk_size) / torch.eye(chunk_size).

  # C-7 Qwen3.6-35B 전치 불변식 (전수 검사: 120행, 양쪽 phase).
  - model: Qwen__Qwen3.6-35B-A3B
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', 'T', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: aten.transpose 불변식 -- core_attn_out 은 value 계보다 (prefill).
  - model: Qwen__Qwen3.6-35B-A3B
    module: 'linear_attn$'
    op_type: transpose
    field: i
    shape: ['B', 'n_h_lin_v', '1', 'd_head_lin_k']
    axis: -1
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    spread: class
    source: aten.transpose 불변식 -- core_attn_out 은 value 계보다 (decode).

  # C-10/C-11 tiny-deepseek-v3: E = k = 8 (모든 전문가로 라우팅)이라 두 이름이 값으로
  # 구분되지 않는다. prefill 은 k*T = 8*17 = 136 이라 라우팅 슬롯 축이 구분되어 이미 정확하나,
  # decode 는 T=1 이라 k*T = 8 = E 로 붕괴해 라우팅 영역 전체가 E 로 잘못 붙었다.
  # 등가류 모드는 gate 까지만 닿는다(sort 가 새 텐서를 만들어 축 사슬이 닫힌다). 그 뒤는
  # op 단위로 못 박는다. 아래 목록은 재트레이스로 발화를 확인해 중복 8건을 걷어낸 최종본이다.
  # **건드리지 않는 정당한 [E]**: histc 의 출력(전문가별 카운트), cumsum 입출력(오프셋),
  # grouped_matmul 의 세 번째 피연산자(그룹 크기), 가중치 [E, ·, ·] 의 첫 축.
