# ④층(LLM이 소스와 대조)의 판정을 산출물에 반영하는 자리.
#
# 여기 있는 항목은 **추론이 아니다.** 규칙은 축 하나를 값으로 결정하는데, 두 config 필드가 같은
# 값을 가지면 값으로는 결정할 수 없다. 그때 소스를 읽으면 답이 나오고, 그 답을 여기 적는다.
#
# 규칙을 고쳐 다시 추론하게 만드는 방법은 두 번 시도해서 두 번 되돌렸다 — 한 op 만 바꾸면 이웃이
# 옛 이름을 유지해 데이터플로우 검사가 무너진다(DeepSeek MLA: reshape 61→122, flow_ambig 0→122).
# 그래서 여기서는 **추론을 다시 돌리지 않고**, 렌더가 끝난 뒤 선언된 모듈 아래의 그 이름을 전부
# 바꾼다. 추론이 아니기 때문에 안전하다.
#
# 필수 항목 (하나라도 없으면 쓰지 않는다):
#   model    models/ 아래 폴더 이름
#   module   모듈 경로 정규식 (레이어 인덱스는 `*` 로 접힌 형태에 매치)
#   from/to  바꿀 이름과 바뀔 이름
#   expect   그 축의 **실제 크기**. 안 맞으면 발화하지 않는다 — 엉뚱한 축에 이름을 붙일 수 없다
#   source   파일:줄 인용. 근거 없는 교정은 교정이 아니다
# 선택:
#   layer_types  하이브리드 스택에서 블록 종류를 한정한다
#
# **게이트가 발화하지 않은 항목을 FAIL 로 잡는다.** 더 이상 맞지 않는 주장(재추적, 규칙 개선,
# 이미 고쳐짐)이 표에 남아 있으면 그때부터 표가 거짓말을 시작한다.
#
# 여기서 표현할 수 없는 것: 텐서가 **어디서 왔는지**로만 구별되는 충돌. MLA 의 `d_nope` vs
# `d_v` 는 둘 다 128 이고 둘 다 `self_attn` 안이며 둘 다 `[B, n_h, T, ·]` 다. 그런 건 소스 줄과
# 함께 `open` 으로 남는다. 자세히는 review/05-overrides.md.

overrides:
  # --- LFM2: rotary 축이 전문가 수의 이름을 달고 있었다 ---
  - model: LiquidAI__LFM2-8B-A1B
    module: '^model\.pos_emb$'
    from: E
    to: d_head/2
    expect: 32
    source: >
      실측 `[1, 16, 32]` 이고 바로 옆 concat 이 `[1, 16, 64]`(=d_head) 다 — rotary 의 inv_freq
      절반 축이다. 전문가 수 E(=32)가 값이 같아 그 이름이 붙었다. rotary 모듈에 MoE 심볼이
      있을 수 없다. (C절 전수 점검 2026-08-12)

  # 같은 축이 어떤 행에서는 `E`, 어떤 행에서는 정수 `32` 였다. 위 항목이 `E` 만 바꾸는 바람에
  # 한 모듈 안에 두 이름이 남았다 — 접힌 표 전건 순회에서 `transpose [B, 32, T] -> [B, T, d_head/2]`
  # 로 드러났다(전치는 축 이름을 바꿀 수 없다). **한쪽만 고치는 수정은 그 자체가 결함이다.**
  - model: LiquidAI__LFM2-8B-A1B
    module: '^model\.pos_emb$'
    from: '32'
    to: d_head/2
    expect: 32
    source: >
      위 항목과 같은 축이다. rotary 의 inv_freq 절반 폭(=d_head/2=32)이며, 이름이 없던 행까지
      함께 맞춘다. (전건 순회 2026-08-12)

  # --- DeepSeek-V2-Lite: 복소수 실수부·허수부 쌍이 공유 전문가 수로 렌더됐다 ---
  - model: deepseek-ai__DeepSeek-V2-Lite
    module: 'self_attn$'
    from: E_shared
    to: '2'
    expect: 2
    source: >
      `view [B,n_h,T,d_head] -> [B,n_h,T,d_rope/2,2]` 를 `view_as_real` 이 소비한다
      (실측 `[1,16,17,32,2]`). 복소수 하나의 실수부·허수부 쌍이며 아키텍처 차원이 아니다 —
      RoPE 를 복소수 곱으로 구현하는 표준 형태. n_shared_experts=2 와 겹친 것은 우연이고,
      `develop/verify/references.yaml` 의 "복소수 pair 분할" 항목이 이미 정수 2 를 정상으로
      등재해 두었다.

  # --- Nemotron-H: Mamba2 chunk-scan 의 decay 행렬 축 ---
  # `decay_chunk = exp(segment_sum(pad(A_cumsum[:,:,:,-1], (1,0))))` -> [B, n_h_ssm, nc+1, nc+1].
  # 우리가 트레이스하는 regime 은 T < d_chunk 라 nc=1 이고 그 축은 말 그대로 2 다.
  # layer_types 로 Mamba 레이어에 한정한다 — 같은 `mixer` 이름의 attention 레이어에서는
  # n_kv=2 가 옳은 이름이기 때문이다.
  - model: nvidia__NVIDIA-Nemotron-3-Super-120B-A12B-BF16
    module: 'mixer'
    from: n_kv
    to: '2'
    expect: 2
    layer_types: [linear_attention, moe]
    source: >
      modeling_nemotron_h.py:320 `decay_chunk = torch.exp(segment_sum(F.pad(
      A_cumsum[:, :, :, -1], (1, 0))))` — 실측 `[1, 128, 2, 2]`. n_chunks+1 이고 여기서는 2 다.
      GQA 의 KV head 수와 무관하다.
  - model: nvidia__NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    module: 'mixer'
    from: n_kv
    to: '2'
    expect: 2
    layer_types: [linear_attention, moe]
    source: >
      Super 와 동일. modeling_nemotron_h.py:320, 실측 `[1, 128, 2, 2]`.
  - model: nvidia__NVIDIA-Nemotron-3-Nano-4B-BF16
    module: 'mixer'
    from: k
    to: '2'
    expect: 2
    layer_types: [linear_attention, mlp]
    source: >
      Super/Ultra 와 같은 축. Nano 는 num_experts_per_tok=2 가 값이 같아 MoE 의 top-k 이름이
      Mamba mixer 로 새어 들었다. modeling_nemotron_h.py:320, 실측 `[1, n_h_ssm, 2, 2]`.

  # --- Nemotron-H: attention 레이어의 k/v 폭에 휴리스틱 이름이 붙었다 ---
  - model: nvidia__NVIDIA-Nemotron-3-Super-120B-A12B-BF16
    module: 'mixer$'
    from: 2*d_head
    to: n_kv*d_head
    expect: 256
    layer_types: [full_attention]
    source: >
      같은 행이 `view [B, T, 2*d_head] -> [B, T, n_kv, d_head]`(실측 `[1, 24, 256] ->
      [1, 24, 2, 128]`)이고, 그 모듈의 k_proj/v_proj 가중치가 `[n_kv*d_head, d_model]`
      (실측 `[256, 4096]`)이다. num_key_value_heads=2 라 `2*d_head` 도 산술로는 참이지만
      등록된 합성 이름이 있는 자리다.

  # --- Kimi-K2 계열: rotary_emb 의 cos/sin 폭은 rope 슬라이스다 ---
  # config.head_dim 이 qk_rope_head_dim 으로 세팅되는 MLA 라 `d_head` 와 값이 같다.
  # 같은 모듈의 inv_freq 축이 이미 `d_rope/2` 로 렌더되므로 2x(d_rope/2) = d_rope 여야 한다.
  # DeepSeek-V3 / tiny-deepseek-v3 / GLM-5.2 에도 같은 판정을 냈지만 그 세 모델에서는 이 이름이
  # 모듈 밖으로 이어지는 텐서와 어긋나 flow_ambig 가 올라갔다(게이트 퇴행 검사). 한쪽만 고치는
  # 수정은 하지 않는다 -- 그 세 건은 review_findings 에 `open` 으로 남겼다.
  - model: moonshotai__Kimi-K2-Instruct
    module: '^model\.rotary_emb$'
    from: d_head
    to: d_rope
    expect: 64
    source: >
      configuration_deepseek_v3.py:124 `self.head_dim = self.qk_rope_head_dim`;
      modeling_deepseek_v3.py:88-92 `dim = getattr(config, "head_dim", ...)` ->
      inv_freq 는 dim/2, cos/sin 은 그 두 배. 같은 모듈에 `d_rope/2` 축이 함께 있다.
  - model: moonshotai__Kimi-K2.6
    module: '^model\.rotary_emb$'
    from: d_head
    to: d_rope
    expect: 64
    source: >
      Kimi-K2-Instruct 와 같은 아키텍처. configuration_deepseek_v3.py:124,
      modeling_deepseek_v3.py:88-92.
  - model: moonshotai__Kimi-K2.7-Code
    module: '^model\.rotary_emb$'
    from: d_head
    to: d_rope
    expect: 64
    source: >
      Kimi-K2-Instruct 와 같은 아키텍처. configuration_deepseek_v3.py:124,
      modeling_deepseek_v3.py:88-92.
