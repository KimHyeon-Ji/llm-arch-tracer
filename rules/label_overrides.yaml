  # 아래 자리는 **압축 KV 경로가 아니라 쿼리 경로**다(축 1 이 n_h_I). 기존 교정은
  # `[B, 1, T/m_csa, n_h_I]` 모양의 KV 경로를 짚고 있어 여기에 안 맞는다.
