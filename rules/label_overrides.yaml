# ④층(LLM이 소스와 대조)의 판정을 산출물에 반영하는 자리.
#
# 여기 있는 항목은 **추론이 아니다.** 규칙은 축 하나를 값으로 결정하는데, 두 config 필드가 같은
# 값을 가지면 값으로는 결정할 수 없다. 그때 소스를 읽으면 답이 나오고, 그 답을 여기 적는다.
#
# 규칙을 고쳐 다시 추론하게 만드는 방법은 두 번 시도해서 두 번 되돌렸다 — 한 op 만 바꾸면 이웃이
# 옛 이름을 유지해 데이터플로우 검사가 무너진다(DeepSeek MLA: reshape 61→122, flow_ambig 0→122).
# 그래서 여기서는 **추론을 다시 돌리지 않고**, 렌더가 끝난 뒤 선언된 모듈 아래의 그 이름을 전부
# 바꾼다. 추론이 아니기 때문에 안전하다.
#
# 필수 항목 (하나라도 없으면 쓰지 않는다):
#   model    models/ 아래 폴더 이름
#   module   모듈 경로 정규식 (레이어 인덱스는 `*` 로 접힌 형태에 매치)
#   from/to  바꿀 이름과 바뀔 이름
#   expect   그 축의 **실제 크기**. 안 맞으면 발화하지 않는다 — 엉뚱한 축에 이름을 붙일 수 없다
#   source   파일:줄 인용. 근거 없는 교정은 교정이 아니다
# 선택:
#   layer_types  하이브리드 스택에서 블록 종류를 한정한다
#
# **게이트가 발화하지 않은 항목을 FAIL 로 잡는다.** 더 이상 맞지 않는 주장(재추적, 규칙 개선,
# 이미 고쳐짐)이 표에 남아 있으면 그때부터 표가 거짓말을 시작한다.
#
# 여기서 표현할 수 없는 것: 텐서가 **어디서 왔는지**로만 구별되는 충돌. MLA 의 `d_nope` vs
# `d_v` 는 둘 다 128 이고 둘 다 `self_attn` 안이며 둘 다 `[B, n_h, T, ·]` 다. 그런 건 소스 줄과
# 함께 `open` 으로 남는다. 자세히는 review/05-overrides.md.

overrides:
  # LFM2 의 self_attn E->d_head/2 override 는 여기 있었다 -- DeepSeek-V2-Lite 항목과 같은
  # `reused_symbol` 버그(2026-08-26 수정) 때문에 rotary 축이 scope 밖 그룹 심볼 `E`(전문가
  # 수)로 잘못 "재사용"되고 있었다. 리졸버가 고쳐지자 이 축은 더 이상 `E`로 안 뜨고(아래 `32`
  # override 가 커버하는 bare 정수로 떨어진다) -- `applied: 0` 으로 확인, 죽은 규칙이라 지운다.

  # 같은 축이 어떤 행에서는 `E`, 어떤 행에서는 정수 `32` 였다. 위 항목이 `E` 만 바꾸는 바람에
  # 한 모듈 안에 두 이름이 남았다 — 접힌 표 전건 순회에서 `transpose [B, 32, T] -> [B, T, d_head/2]`
  # 로 드러났다(전치는 축 이름을 바꿀 수 없다). **한쪽만 고치는 수정은 그 자체가 결함이다.**
  # gate_up_proj 의 가운데 축 교정(d_model -> 2*d_moe)은 **적용하지 않는다 -- 시도했다가 물렸다.**
  # 지적 자체는 옳다: modeling_*.py 가 gate_up_proj 를 [E, 2*intermediate, hidden] 로 선언하고,
  # 같은 행의 output 이 이미 [k*T, 2*d_moe] 로 그렇게 말한다(MiniMax-M2 A-2 / OLMoE B-8 /
  # DeepSeek-V4-Flash F-1).
  #
  # 그런데 이 모델들은 d_model == 2*d_moe 라 **원본 [E,2*d_moe,d_model] 과 전치본
  # [E,d_model,2*d_moe] 의 구체 shape 이 완전히 같다.** 그래서 라벨을 고치는 순간
  # `_weight_agrees_with_operand` 가 weight_shape 를 피연산자 표기로 동기화하고,
  # `_resync_param_labels` 가 파라미터 단위로 되돌리고, 마지막 agree 가 다시 갈라놓는다.
  # 결과: 한 파라미터가 op 마다 다른 표기 -> `param_incons` 가 0 에서 뛴다(2026-09-03 실측:
  # MiniMax 124행). down_proj 는 구체 shape 이 달라 같은 일이 안 생긴다.
  #
  # override 는 이 세 패스보다 **먼저** 돌기 때문에 무엇을 써도 덮인다. 고치려면
  # src/build_table.py 의 weight/operand 동기화가 "이름만 다르고 구체가 같은" 경우를
  # 구분하도록 바꿔야 한다 -- 함대 전체에 영향이 가는 변경이라 여기서 하지 않는다.
  # review_findings 의 open 으로 남긴다.

  # --- Llama-4-Maverick: decode attention bmm 의 가운데 축은 배치가 아니다 ---
  #
  # `[n_h, B, d_head]` 로 찍혔는데 구체는 `[40, 1, 128]` 이고, 그 1 은 **decode 의 query
  # 길이**다. 실행이 B=1 이라 값이 같아 리졸버가 잘못 골랐다(외부 검토 2026-09-11).
  #
  # **B=2 로 한 번 더 트레이스해 확인했다**(`develop/batch_axis_probe.py`):
  #     decode op130   B=1 [40, 1, 128]  ->  B=2 [80, 1, 128]
  # 축 0 이 2배가 되고(= B*n_h) 축 1 은 1 그대로다. 즉 축 1 은 배치가 아니다.
  #
  # **전역 규칙("배치는 축 0 에만")으로 올리려다 물렸다.** 같은 프로브가 MoE 쪽에서
  # `[E, B*T, d_moe]` 의 축 1 이 배치를 따라 2배가 되는 것을 보여준다 -- 축 1 이 배치
  # 의존일 수 있으므로 일반 규칙으로 만들면 그쪽을 `1` 로 오염시킨다. 소스로 확인된 이
  # 자리에만 건다.
  - model: meta-llama__Llama-4-Maverick-17B-128E
    module: 'self_attn$'
    op_type: batched_matmul
    # **등가류 전체에 편다.** bmm 만 고쳤더니 그 피연산자를 만든 `view` 는 `B` 로 남아
    # 한 축에 두 이름이 생겼다 -- 데이터플로우 불일치 192건 / 등가류 두 이름 192건으로
    # `verify_all` 이 잡았다(2026-09-12). 한쪽만 고치는 수정은 그 자체가 결함이다.
    spread: class
    from: B
    to: '1'
    expect: 1
    source: >
      modeling_llama4.py:362 `hidden_shape = (*input_shape, -1, self.head_dim)` 에서
      `input_shape` 는 `(B, T_q)` 이고 decode 는 `T_q = 1` 이다. transpose 뒤
      `[B, n_h, 1, d_head]` 가 되고 bmm 이 앞 둘을 접어 `[B*n_h, 1, d_head]` 가 된다.
      가운데 축은 query 길이이지 배치가 아니다. B=2 프로브가 `[40,1,128] -> [80,1,128]`
      로 축 0 만 2배가 되는 것을 보여준다.

  - model: LiquidAI__LFM2-8B-A1B
    module: '^model\.pos_emb$'
    from: '32'
    to: d_head/2
    expect: 32
    source: >
      위 항목과 같은 축이다. rotary 의 inv_freq 절반 폭(=d_head/2=32)이며, 이름이 없던 행까지
      함께 맞춘다. (전건 순회 2026-08-12)

  # DeepSeek-V2-Lite 의 self_attn E_shared->2 override 는 여기 있었다 -- `reused_symbol` 이
  # avoid 멤버십을 안 봐서 scope 밖 그룹 심볼까지 값만 맞으면 "재사용"으로 잘못 반환하던 버그
  # (src/symbolic_shape.py) 를 2026-08-26 에 고치자 override 없이도 리졸버가 그대로 `2` 를
  # 낸다 -- `applied: 0` 으로 확인. 근본 원인을 고쳤으니 이 override 는 죽은 규칙이라 지운다
  # (남겨두면 "발화하지 않는 override" 로 게이트가 FAIL 시킨다).

  # Nemotron-H Super/Ultra(n_kv->2)와 Nano(k->2)의 Mamba2 chunk-scan decay 축 override 는
  # 여기 있었다 -- 같은 `reused_symbol` 버그. `decay_chunk`(modeling_nemotron_h.py:320,
  # `[1, 128, 2, 2]`/`[1, n_h_ssm, 2, 2]`, n_chunks+1=2)가 GQA의 n_kv 또는 MoE의 top-k(k)와
  # 값만 우연히 같아 scope 밖 그룹 심볼로 "재사용"되고 있었다. 리졸버가 고쳐지자 세 모델 다
  # override 없이 바로 `2`를 낸다 -- `applied: 0` 으로 확인, 죽은 규칙이라 지운다.

