  # ============================================================================
  # 배치 J — GLM-5.2. 64/128/256 값 충돌이 겹친다.
  # d_head = d_rope = 64 / 2*d_head = c_I = 128 / n_h_I = d_rope/2 = 32 /
  # d_v = d_nope+d_rope = 256. 근거 전문: develop/verdicts_csvjsonl_batchJ.md
