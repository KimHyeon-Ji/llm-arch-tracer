  # 클래스 765건 -> 대표 17개. 반증 없음 180 클래스는 버렸다. `histc` 출력과 grouped_matmul 의
  # weight/offsets 은 진짜 전문가 축이라 probe 에서 128 로 남았고 자동으로 제외됐다.
