# ④층(LLM이 소스와 대조)의 판정을 산출물에 반영하는 자리.
#
# 여기 있는 항목은 **추론이 아니다.** 규칙은 축 하나를 값으로 결정하는데, 두 config 필드가 같은
# 값을 가지면 값으로는 결정할 수 없다. 그때 소스를 읽으면 답이 나오고, 그 답을 여기 적는다.
#
# 규칙을 고쳐 다시 추론하게 만드는 방법은 두 번 시도해서 두 번 되돌렸다 — 한 op 만 바꾸면 이웃이
# 옛 이름을 유지해 데이터플로우 검사가 무너진다(DeepSeek MLA: reshape 61→122, flow_ambig 0→122).
# 그래서 여기서는 **추론을 다시 돌리지 않고**, 렌더가 끝난 뒤 선언된 모듈 아래의 그 이름을 전부
# 바꾼다. 추론이 아니기 때문에 안전하다.
#
# 필수 항목 (하나라도 없으면 쓰지 않는다):
#   model    models/ 아래 폴더 이름
#   module   모듈 경로 정규식 (레이어 인덱스는 `*` 로 접힌 형태에 매치)
#   from/to  바꿀 이름과 바뀔 이름
#   expect   그 축의 **실제 크기**. 안 맞으면 발화하지 않는다 — 엉뚱한 축에 이름을 붙일 수 없다
#   source   파일:줄 인용. 근거 없는 교정은 교정이 아니다
# 선택:
#   layer_types  하이브리드 스택에서 블록 종류를 한정한다
#
# **게이트가 발화하지 않은 항목을 FAIL 로 잡는다.** 더 이상 맞지 않는 주장(재추적, 규칙 개선,
# 이미 고쳐짐)이 표에 남아 있으면 그때부터 표가 거짓말을 시작한다.
#
# 여기서 표현할 수 없는 것: 텐서가 **어디서 왔는지**로만 구별되는 충돌. MLA 의 `d_nope` vs
# `d_v` 는 둘 다 128 이고 둘 다 `self_attn` 안이며 둘 다 `[B, n_h, T, ·]` 다. 그런 건 소스 줄과
# 함께 `open` 으로 남는다. 자세히는 review/05-overrides.md.

overrides:
  # --- LFM2: rotary 축이 전문가 수의 이름을 달고 있었다 ---
  - model: LiquidAI__LFM2-8B-A1B
    module: '^model\.pos_emb$'
    from: E
    to: d_head/2
    expect: 32
    source: >
      실측 `[1, 16, 32]` 이고 바로 옆 concat 이 `[1, 16, 64]`(=d_head) 다 — rotary 의 inv_freq
      절반 축이다. 전문가 수 E(=32)가 값이 같아 그 이름이 붙었다. rotary 모듈에 MoE 심볼이
      있을 수 없다. (C절 전수 점검 2026-08-12)

  # 같은 축이 어떤 행에서는 `E`, 어떤 행에서는 정수 `32` 였다. 위 항목이 `E` 만 바꾸는 바람에
  # 한 모듈 안에 두 이름이 남았다 — 접힌 표 전건 순회에서 `transpose [B, 32, T] -> [B, T, d_head/2]`
  # 로 드러났다(전치는 축 이름을 바꿀 수 없다). **한쪽만 고치는 수정은 그 자체가 결함이다.**
  - model: LiquidAI__LFM2-8B-A1B
    module: '^model\.pos_emb$'
    from: '32'
    to: d_head/2
    expect: 32
    source: >
      위 항목과 같은 축이다. rotary 의 inv_freq 절반 폭(=d_head/2=32)이며, 이름이 없던 행까지
      함께 맞춘다. (전건 순회 2026-08-12)

  # --- DeepSeek-V2-Lite: 복소수 실수부·허수부 쌍이 공유 전문가 수로 렌더됐다 ---
  - model: deepseek-ai__DeepSeek-V2-Lite
    module: 'self_attn$'
    from: E_shared
    to: '2'
    expect: 2
    source: >
      `view [B,n_h,T,d_head] -> [B,n_h,T,d_rope/2,2]` 를 `view_as_real` 이 소비한다
      (실측 `[1,16,17,32,2]`). 복소수 하나의 실수부·허수부 쌍이며 아키텍처 차원이 아니다 —
      RoPE 를 복소수 곱으로 구현하는 표준 형태. n_shared_experts=2 와 겹친 것은 우연이고,
      `develop/verify/references.yaml` 의 "복소수 pair 분할" 항목이 이미 정수 2 를 정상으로
      등재해 두었다.

  # --- Nemotron-H: Mamba2 chunk-scan 의 decay 행렬 축 ---
  # `decay_chunk = exp(segment_sum(pad(A_cumsum[:,:,:,-1], (1,0))))` -> [B, n_h_ssm, nc+1, nc+1].
  # 우리가 트레이스하는 regime 은 T < d_chunk 라 nc=1 이고 그 축은 말 그대로 2 다.
  # layer_types 로 Mamba 레이어에 한정한다 — 같은 `mixer` 이름의 attention 레이어에서는
  # n_kv=2 가 옳은 이름이기 때문이다.
  - model: nvidia__NVIDIA-Nemotron-3-Super-120B-A12B-BF16
    module: 'mixer'
    from: n_kv
    to: '2'
    expect: 2
    layer_types: [linear_attention, moe]
    source: >
      transformers 5.14.1 installed source modeling_nemotron_h.py:72-572; revalidated this axis verdict unchanged.
      modeling_nemotron_h.py:320 `decay_chunk = torch.exp(segment_sum(F.pad(
      A_cumsum[:, :, :, -1], (1, 0))))` — 실측 `[1, 128, 2, 2]`. n_chunks+1 이고 여기서는 2 다.
      GQA 의 KV head 수와 무관하다.
  - model: nvidia__NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    module: 'mixer'
    from: n_kv
    to: '2'
    expect: 2
    layer_types: [linear_attention, moe]
    source: >
      transformers 5.14.1 installed source modeling_nemotron_h.py:72-572; revalidated this axis verdict unchanged.
      Super 와 동일. modeling_nemotron_h.py:320, 실측 `[1, 128, 2, 2]`.
  - model: nvidia__NVIDIA-Nemotron-3-Nano-4B-BF16
    module: 'mixer'
    from: k
    to: '2'
    expect: 2
    layer_types: [linear_attention, mlp]
    source: >
      Super/Ultra 와 같은 축. Nano 는 num_experts_per_tok=2 가 값이 같아 MoE 의 top-k 이름이
      Mamba mixer 로 새어 들었다. modeling_nemotron_h.py:320, 실측 `[1, n_h_ssm, 2, 2]`.

  # --- Nemotron-H: attention 레이어의 k/v 폭에 휴리스틱 이름이 붙었다 ---
  - model: moonshotai__Kimi-K2-Instruct
    module: '^model\.rotary_emb$'
    spread: class
    from: d_head
    to: d_rope
    expect: 64
    source: >
      configuration_deepseek_v3.py:124 `self.head_dim = self.qk_rope_head_dim`;
      modeling_deepseek_v3.py:88-92 `dim = getattr(config, "head_dim", ...)` ->
      inv_freq 는 dim/2, cos/sin 은 그 두 배. 같은 모듈에 `d_rope/2` 축이 함께 있다.

  # --- Kimi-K2-Instruct MLA: value-cache 경로의 head 폭 ---
  - model: moonshotai__Kimi-K2-Instruct
    module: 'self_attn$'
    spread: class
    shape: ["B", "n_h", "T", "d_nope"]
    axis: 3
    field: o
    shape_index: 0
    op_type: concat
    nth: 5
    from: d_nope
    to: d_v
    expect: 128
    source: >
      modeling_deepseek_v3.py:419 `k_nope, value_states = torch.split(kv_nope,
      [self.qk_nope_head_dim, self.v_head_dim], dim=-1)` — nth 5 cache concat 이 나르는
      둘째 조각은 value_states 이므로 마지막 축은 d_v 다. :401-403 의 o_proj 입력도
      `num_heads * v_head_dim` 으로 선언된다.
  - model: moonshotai__Kimi-K2-Instruct
    module: 'self_attn$'
    spread: class
    shape: ["B", "n_h", "T+1", "d_nope"]
    axis: 3
    field: o
    shape_index: 0
    op_type: concat
    nth: 5
    from: d_nope
    to: d_v
    expect: 128
    source: >
      modeling_deepseek_v3.py:419 `k_nope, value_states = torch.split(kv_nope,
      [self.qk_nope_head_dim, self.v_head_dim], dim=-1)` — decode 의 nth 5 cache concat 이
      누적하는 둘째 조각은 value_states 이므로 마지막 축은 d_v 다. :401-403 의 o_proj
      입력도 `num_heads * v_head_dim` 으로 선언된다.
  - model: moonshotai__Kimi-K2.6
    module: '^model\.rotary_emb$'
    spread: class
    from: d_head
    to: d_rope
    expect: 64
    source: >
      Kimi-K2-Instruct 와 같은 아키텍처. configuration_deepseek_v3.py:124,
      modeling_deepseek_v3.py:88-92.
  - model: moonshotai__Kimi-K2.7-Code
    module: '^model\.rotary_emb$'
    spread: class
    from: d_head
    to: d_rope
    expect: 64
    source: >
      Kimi-K2-Instruct 와 같은 아키텍처. configuration_deepseek_v3.py:124,
      modeling_deepseek_v3.py:88-92.

  # --- Qwen3-Next 계열: gated RMSNorm 은 value head dim 으로 만들어진다 (등가류 모드) ---
  # 2026-08-13 에 모듈 스코프로 넣었다가 flow_ambig 108->324 로 되돌린 항목이다. 원인은 이름이
  # 모듈 경계에서 멈춰 같은 텐서의 이웃이 옛 이름을 유지한 것이었고, `spread: class` 가 바로
  # 그것을 없앤다 — 축 등가류 전체가 한 이름을 받는다(src/axis_classes.py).
  - model: Qwen__Qwen3-Next-80B-A3B-Instruct
    module: 'linear_attn\.norm$'
    spread: class
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    source: >
      transformers 5.14.1 installed source modeling_qwen3_next.py:374-708; revalidated this axis verdict unchanged.
      modeling_qwen3_next.py:552 `self.norm = Qwen3NextRMSNormGated(self.head_v_dim, ...)`,
      :519 `self.head_v_dim = config.linear_value_head_dim`. linear_key_head_dim 과
      linear_value_head_dim 이 둘 다 128 이라 값으로는 구별되지 않는다. 실측 `[544, 128]`.

  # 같은 판정을 Qwen3.5 / 3.6 계열에도. 셋 다 같은 gated delta rule 블록을 쓴다.
  - model: Qwen__Qwen3.5-4B
    module: 'linear_attn\.norm$'
    spread: class
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    source: >
      transformers 5.14.1 installed source modeling_qwen3_5.py:248-558; revalidated this axis verdict unchanged.
      modeling_qwen3_next.py:552 `self.norm = Qwen3NextRMSNormGated(self.head_v_dim, ...)`,
      :519 `self.head_v_dim = config.linear_value_head_dim`. Qwen3.5 는 같은 블록을 쓴다.
  - model: Qwen__Qwen3.5-397B-A17B
    module: 'linear_attn\.norm$'
    spread: class
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    source: >
      transformers 5.14.1 installed source modeling_qwen3_5_moe.py:245-555; revalidated this axis verdict unchanged.
      modeling_qwen3_next.py:552 / :519 — 같은 블록.
  - model: Qwen__Qwen3.6-27B
    module: 'linear_attn\.norm$'
    spread: class
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    source: >
      transformers 5.14.1 installed source modeling_qwen3_5.py:248-558; revalidated this axis verdict unchanged.
      modeling_qwen3_next.py:552 / :519 — 같은 블록.
  - model: Qwen__Qwen3.6-35B-A3B
    module: 'linear_attn\.norm$'
    spread: class
    from: d_head_lin_k
    to: d_head_lin_v
    expect: 128
    source: >
      transformers 5.14.1 installed source modeling_qwen3_5_moe.py:245-555; revalidated this axis verdict unchanged.
      modeling_qwen3_next.py:552 / :519 — 같은 블록.

  # --- DeepSeek-V4: grouped output projection 의 그룹 축 (등가류 모드) ---
  # o_a_proj 는 DeepseekV4GroupedLinear 이고 그 축은 o_groups 다. V4-Pro 는 g_o=16 이 
  # T/m_hca(2048/128=16)와, V4-Flash 는 g_o=8 이 T/m_hca(1032/128=8)와 값이 겹친다.
  - model: deepseek-ai__DeepSeek-V4-Pro
    module: 'o_a_proj$'
    spread: class
    from: g_o
    to: g_o
    expect: 16
    source: >
      modeling_deepseek_v4.py:783-785 `self.o_a_proj = DeepseekV4GroupedLinear(
      self.num_heads * self.head_dim // config.o_groups, config.o_groups * config.o_lora_rank,
      config.o_groups)` 이고 :317-323 의 forward 가 `self.weight.view(self.n_groups, -1,
      hidden_dim)` 로 그 축을 만든다. 시퀀스에서 유도된 T/m_hca 가 이 자리에 올 수 없다.
  - model: deepseek-ai__DeepSeek-V4-Flash
    module: 'o_a_proj$'
    spread: class
    from: g_o
    to: g_o
    expect: 8
    source: >
      V4-Pro 와 같은 코드. modeling_deepseek_v4.py:783-785 / :317-323. o_groups=8.
  - model: deepseek-ai__DeepSeek-V4-Flash-0731
    module: 'o_a_proj$'
    spread: class
    from: g_o
    to: g_o
    expect: 8
    source: >
      V4-Pro 와 같은 코드. modeling_deepseek_v4.py:783-785 / :317-323. o_groups=8.

  # --- DeepSeek-V4-Flash: partial RoPE 의 cos/sin 전체 폭 ---
  - model: deepseek-ai__DeepSeek-V4-Flash
    module: 'self_attn$'
    spread: class
    shape: ["B", "T", "n_h"]
    axis: 2
    field: o
    shape_index: 0
    op_type: view
    nth: 5
    from: n_h
    to: d_rope
    expect: 64
    source: >
      modeling_deepseek_v4.py:338-350 `cos`/`sin` 의 d_rope/2 항목을
      `repeat_interleave(2, dim=-1)`로 전체 `rope_dim`까지 늘리고, 그 폭으로
      `x[..., -rope_dim:]`을 회전한다. 따라서 `[B,T,d_rope/2,2]`를 평탄화한
      nth 5 view의 마지막 축은 head 수가 아니라 d_rope다.
  - model: deepseek-ai__DeepSeek-V4-Flash
    module: 'self_attn$'
    spread: class
    shape: ["B", "1", "n_h"]
    axis: 2
    field: o
    shape_index: 0
    op_type: view
    nth: 5
    from: n_h
    to: d_rope
    expect: 64
    source: >
      decode의 같은 자리. modeling_deepseek_v4.py:338-350에서 d_rope/2인 cos/sin을
      `repeat_interleave(2, dim=-1)`해 `rope_dim`을 만들므로 `[B,1,d_rope/2,2]`를
      평탄화한 nth 5 view의 마지막 축은 d_rope다.
  - model: deepseek-ai__DeepSeek-V4-Flash-0731
    module: 'self_attn$'
    spread: class
    shape: ["B", "T", "n_h"]
    axis: 2
    field: o
    shape_index: 0
    op_type: view
    nth: 5
    from: n_h
    to: d_rope
    expect: 64
    source: >
      modeling_deepseek_v4.py:338-350 `cos`/`sin` 의 d_rope/2 항목을
      `repeat_interleave(2, dim=-1)`로 전체 `rope_dim`까지 늘리고, 그 폭으로
      `x[..., -rope_dim:]`을 회전한다. 따라서 `[B,T,d_rope/2,2]`를 평탄화한
      nth 5 view의 마지막 축은 head 수가 아니라 d_rope다.
  - model: deepseek-ai__DeepSeek-V4-Flash-0731
    module: 'self_attn$'
    spread: class
    shape: ["B", "1", "n_h"]
    axis: 2
    field: o
    shape_index: 0
    op_type: view
    nth: 5
    from: n_h
    to: d_rope
    expect: 64
    source: >
      decode의 같은 자리. modeling_deepseek_v4.py:338-350에서 d_rope/2인 cos/sin을
      `repeat_interleave(2, dim=-1)`해 `rope_dim`을 만들므로 `[B,1,d_rope/2,2]`를
      평탄화한 nth 5 view의 마지막 축은 d_rope다.

  # --- DeepSeek-V4-Flash: 그룹당 중간 폭은 o_lora_rank 다 ---
  # q_lora_rank == o_lora_rank == 1024 라 값으로는 못 가른다. 판정은 이미 내려져 있다.
  - model: openai__gpt-oss-120b
    module: 'mlp\.experts$'
    spread: class
    from: d_moe
    to: d_model
    expect: 2880
    source: >
      modeling_gpt_oss.py:75-78 `gate_up_proj = nn.Parameter(num_experts, hidden_size,
      2 * intermediate_size)` — 전문가에 **들어가는** 폭은 hidden_size 다. 라우팅 게더
      `index([T, d_model], [k*T])` 가 만든 텐서이므로 잔차 스트림이며, intermediate_size 는
      그 안에서만 쓰인다.
  - model: openai__gpt-oss-20b
    module: 'mlp\.experts$'
    spread: class
    from: d_moe
    to: d_model
    expect: 2880
    source: >
      120b 와 동일. modeling_gpt_oss.py:75-78.

  # --- Hunyuan: 공유 MLP 폭이 랭크 바뀌는 view 너머에서 이름을 잃었다 ---
  - model: tencent__Hunyuan-A13B-Instruct
    module: 'shared_mlp'
    spread: class
    from: '3072'
    to: d_moe
    expect: 3072
    source: >
      modeling_hunyuan_v1_moe.py:71-74 `self.intermediate_size = config.intermediate_size;
      self.gate_proj = nn.Linear(self.hidden_size, self.intermediate_size, ...)` — 폭 3072 은
      FFN intermediate 다. matmul 은 그 이름을 갖고 있는데 바로 뒤 `_unsafe_view` 가 랭크를
      바꾸면서 이름을 잃어 정수로 남았다(같은 등가류 안의 두 이름).

  # 여기 있던 항목 3개는 2026-08-14 에 **지웠다**: 축 등가류 통일
  # (src/build_table._unify_axis_classes + src/axis_classes 의 간선 (1)~(4))이 그 자리를
  # 스스로 바로잡아 override 가 아무 축에도 안 맞게 됐다. 게이트의 "발화하지 않은 교정" 검사가
  # 그것을 잡았고, 그게 이 검사의 존재 이유다 -- 낡은 주장을 표에 남겨 두면 표가 거짓말을 시작한다.
  #   - DeepSeek-V4-Flash / -0731  `o_a_proj` 의 c_q vs d_g  (지금 d_g 1,118축, c_q 0축)
  #   - Nemotron-3-Super `mixer` 의 2*d_head -> n_kv*d_head  (지금 n_kv*d_head 288축, 2*d_head 0축)

  # --- 위 교정의 **상류 완성** (2026-08-14) ---
