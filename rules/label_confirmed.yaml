# ④층(LLM이 소스와 대조)이 **"봤고, 지금 이름이 맞다"** 고 판정한 자리.
#
# 검토의 결과는 둘이다 — 고칠 것(`rules/label_overrides.yaml`)과 **맞는 것**(여기).
# 고칠 것만 적을 자리가 있으면 "맞다"는 판정이 아무 데도 남지 않고, 그 축은 재생성마다
# 다시 질문으로 올라온다. 2026-08-14 외부 검토가 18건을 보고 2건을 고쳤는데 나머지 16건은
# 기록되지 못했다 — 다음 검토자가 같은 소스를 다시 읽어야 한다는 뜻이었다.
#
# 동일명 override 로는 대신할 수 없다: 아무것도 안 바꾸므로 `applied: 0` 이 되어 게이트가
# 죽은 교정으로 잡는다. 확인은 교정이 아니므로 자기 자리가 필요하다.
#
# 필수 항목 — override 와 같은 앵커 선택자로 **한 등가류만** 지목한다:
#   model / module / shape / axis / field / shape_index / op_type / nth
#   label    그 축의 이름. **지금 렌더된 이름과 같아야 한다.**
#   expect   그 축의 실측 크기
#   source   무엇을 읽고 그렇게 판단했는지. 근거 없는 확인은 확인이 아니다
#
# **낡으면 게이트가 잡는다.** 규칙이 바뀌어 그 축의 이름이 달라지면 `matched: 0` 이 되고
# FAIL 이다 — 낡은 확인은 낡은 교정과 똑같이 위험하다. "예전에 맞았다"는 지금 맞다는 뜻이
# 아니다.
#
# 인계 목록(`full/*.unsettled.json`)은 여기 적힌 축을 빼고 만든다.

