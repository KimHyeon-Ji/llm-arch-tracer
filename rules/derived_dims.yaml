# 파생 차원 규칙 — config 필드 하나로 안 떨어지고 **계산**으로 나오는 고정 차원의 이름표.
#
# 왜 필요한가: symbols.yaml은 "config 필드 ↔ 심볼" 1:1 매핑만 한다. 하지만 실제 트레이스에는
# `n_h·d_head/g_o`(그룹 출력 투영 폭), `T + T/m`(압축 KV 길이) 같은 **합성 차원**이 잔뜩 나온다.
# 이게 등록되어 있지 않으면 model_summary.md의 "유도 상수" 표에 정체불명 숫자로 남는다.
#
# 규칙(01-main.md P1): 여기 있는 건 전부 **계산해서 값이 정확히 일치할 때만** 붙는 이름이다.
# 인수분해로 아무 이름이나 갖다 붙이지 않는다. 새 아키텍처를 만나 정체불명 숫자가 남으면
# 02-new-module-handling.md의 "신규 모듈 조사 절차"를 따라 **믿을 만한 소스로 확인한 뒤**
# 여기에 식과 출처를 함께 추가한다. 확인 못 하면 추측해서 넣지 말고 미해결로 남겨
# 사람 검증(Tier 3)으로 넘긴다.
#
# vars: 심볼이 아닌 부수 스칼라(중첩 dict 값, float 계수 등)를 eval 네임스페이스에 올린다.
#   from.aliases  config 속성명 후보
#   from.field + from.key  dict 필드에서 key로 꺼냄
# rules: expr를 심볼+vars로 평가해 값이 맞으면 name을 붙인다. 사용 가능한 함수: ceil, round, min, max.

vars:
  m_csa:
    meaning: "CSA 압축률 m (토큰 m개 → 압축 엔트리 1개)"
    from: {field: compress_rates, key: compressed_sparse_attention}
  m_hca:
    meaning: "HCA 압축률 m′"
    from: {field: compress_rates, key: heavily_compressed_attention}
  pr:
    meaning: "부분 RoPE 비율 (회전 차원 / head 차원)"
    from: {aliases: [partial_rotary_factor]}
  ffn_f:
    meaning: "FFN 확장 계수 (xLSTM 계열)"
    from: {aliases: [ffn_proj_factor]}
  ffn_r:
    meaning: "FFN 차원 반올림 단위"
    from: {aliases: [ffn_round_up_to_multiple_of]}
  qk_f:
    meaning: "xLSTM q/k 투영 폭 계수 (d_model 대비)"
    from: {aliases: [qk_dim_factor]}
  v_f:
    meaning: "xLSTM v 투영 폭 계수 (d_model 대비)"
    from: {aliases: [v_dim_factor]}

rules:
  # ---- MLA q/k head 폭 ----
  # DeepSeek-V3는 config.__init__ 에서 qk_head_dim = qk_nope_head_dim + qk_rope_head_dim 을
  # 미리 계산해 필드로 들고 있어서, 모델 코드가 그 합을 다시 계산하지 않는다. 그래서 이 값만
  # 이름을 못 받고 정수로 남았다(V2-Lite는 inline 계산이라 자동으로 붙는다).
  # 출처: transformers/models/deepseek_v3/configuration_deepseek_v3.py:122 (실행 중인 코드).
  - expr: "d_nope + d_rope"
    scope: "attn|attention|compressor|indexer"
    sym: "d_nope+d_rope"
    name: "d_nope + d_rope (MLA q/k head 폭)"

  # ---- 부분 RoPE (partial rotary) ----
  # 회전은 head 차원의 앞 d_rope에만 걸고 나머지는 그대로 통과 후 다시 concat.
  # 출처: transformers deepseek_v4 / qwen3_next modeling의 apply_rotary_pos_emb 분할.
  - expr: "d_head - d_rope"
    scope: "attn|attention|rotary|compressor|indexer"
    sym: "d_head-d_rope"
    name: "d_head − d_rope (부분 RoPE 비회전 통과분)"
  - expr: "d_head - round(d_head * pr)"
    scope: "attn|attention|rotary|compressor|indexer"
    sym: "d_head-d_rope"
    name: "d_head − d_rope (부분 RoPE 비회전 통과분, partial_rotary_factor 기준)"

  # ---- DeepSeek-V4 grouped output projection ----
  # 출처: transformers deepseek_v4 DeepseekV4GroupedLinear docstring(§2.3.1 Grouped Output
  # Projection), rules/structures/attention/grouped-output-projection.md
  - expr: "g_o * d_g"
    scope: "o_a_proj|o_b_proj|self_attn"
    sym: "g_o*d_g"
    name: "g_o·d_g (grouped output projection 합친 폭 → o_b_proj 입력)"
  - expr: "n_h * d_head // g_o"
    scope: "o_a_proj|o_b_proj|self_attn"
    sym: "n_h*d_head/g_o"
    name: "n_h·d_head/g_o (grouped output projection 그룹당 입력 폭)"

  # ---- DeepSeek-V4 블록 압축 attention (CSA / HCA) ----
  # 압축 엔트리 수 = T/m. 코어 attention은 sliding KV 뒤에 압축 KV를 concat하고,
  # 학습형 attention sink 1열이 score 행렬에 더 붙는다(+1).
  # 출처: transformers deepseek_v4 (CSA/HCACompressor, DeepseekV4Attention.forward),
  # vLLM 블로그 2026-04-24 "c4a/c128a" 설명, rules/structures/attention/csa.md·hca.md
  - expr: "T + T // m_csa + 1"
    scope: "attn|attention"
    sym: "T+T/m_csa+1"
    name: "T + T/m_csa + 1 (CSA 레이어 score 폭: sliding KV ⊕ 압축 KV ⊕ attention sink)"
  - expr: "T + T // m_hca + 1"
    scope: "attn|attention"
    sym: "T+T/m_hca+1"
    name: "T + T/m_hca + 1 (HCA 레이어 score 폭: sliding KV ⊕ 압축 KV ⊕ attention sink)"
  - expr: "T + T // m_csa"
    scope: "attn|attention"
    sym: "T+T/m_csa"
    name: "T + T/m_csa (CSA 레이어 KV 길이: sliding ⊕ 압축 엔트리)"
  - expr: "T + T // m_hca"
    scope: "attn|attention"
    sym: "T+T/m_hca"
    name: "T + T/m_hca (HCA 레이어 KV 길이: sliding ⊕ 압축 엔트리)"
  # decode에서는 sliding 분기의 KV가 window에서 상한이 걸리므로 score 폭이 `T + …`가 아니라
  # `w_local + …`가 된다(prefill 규칙과 짝을 이룬다). 예전엔 이 값들이 휴리스틱으로 아무 이름이나
  # 받았고, 휴리스틱을 조인 뒤 정수로 드러나서 규칙으로 등재했다(자유 평가 2026-07-31).
  # V4-Pro 실측(T=2048, w_local=128, m_csa=4, m_hca=128): 640·641·144·145
  # V4-Flash 실측(T=1032): 386·387·136·137
  - expr: "w_local + T // m_csa + 1"
    scope: "attn|attention"
    sym: "w_local+T/m_csa+1"
    name: "w_local + T/m_csa + 1 (decode CSA score 폭: window KV ⊕ 압축 KV ⊕ attention sink)"
  - expr: "w_local + T // m_hca + 1"
    scope: "attn|attention"
    sym: "w_local+T/m_hca+1"
    name: "w_local + T/m_hca + 1 (decode HCA score 폭: window KV ⊕ 압축 KV ⊕ attention sink)"
  - expr: "w_local + T // m_csa"
    scope: "attn|attention"
    sym: "w_local+T/m_csa"
    name: "w_local + T/m_csa (decode CSA KV 길이)"
  - expr: "w_local + T // m_hca"
    scope: "attn|attention"
    sym: "w_local+T/m_hca"
    name: "w_local + T/m_hca (decode HCA KV 길이)"
  - expr: "T // m_hca + 1"
    scope: "attn|attention|compressor|indexer"
    sym: "T/m_hca+1"
    name: "T/m_hca + 1 (HCA block-bias 버퍼 = 압축 엔트리 수 + 무효 인덱스 슬롯 1)"
  - expr: "T // m_csa + 1"
    scope: "attn|attention|compressor|indexer"
    sym: "T/m_csa+1"
    name: "T/m_csa + 1 (CSA block-bias 버퍼 = 압축 엔트리 수 + 무효 인덱스 슬롯 1)"
  - expr: "T // m_csa - 1"
    scope: "attn|attention|compressor|indexer"
    sym: "T/m_csa-1"
    name: "T/m_csa − 1 (CSA Ca/Cb 겹침 shift: 이전 윈도우 기여분 슬라이스)"
  - expr: "T // m_csa"
    scope: "attn|attention|compressor|indexer"
    sym: "T/m_csa"
    name: "T/m_csa (CSA 압축 엔트리 수)"
  - expr: "T // m_hca"
    scope: "attn|attention|compressor|indexer"
    sym: "T/m_hca"
    name: "T/m_hca (HCA 압축 엔트리 수)"

  # ---- fused QKV 투영 (Q·K·V를 한 행렬로) ----
  # Falcon은 q,k,v를 한 번에 낸다: (n_h + 2·n_kv)·d_head.
  # 출처: transformers models/falcon/modeling_falcon.py
  #   qkv_out_dim = (num_kv_heads * 2 + num_attention_heads) * head_dim
  - expr: "(n_h + 2 * n_kv) * d_head"
    scope: "attn|attention|query_key_value|qkv"
    sym: "(n_h+2*n_kv)*d_head"
    name: "(n_h + 2·n_kv)·d_head (fused QKV 투영 폭 — Q·K·V 한 행렬)"
  # fused QKV를 head 축으로 펼칠 때 나오는 head 총수. Falcon-7B에서 `[B,T,73,d_head]`의
  # 73이 정수로 남아 있었다(71 Q + 1 K + 1 V) — 리뷰 패킷을 만들어 트레이스를 압축된
  # 형태로 훑다가 눈에 띄었다(2026-07-30).
  - expr: "n_h + 2 * n_kv"
    scope: "attn|attention|query_key_value|qkv"
    sym: "n_h+2*n_kv"
    name: "n_h + 2·n_kv (fused QKV를 head 축으로 편 총 head 수: Q + K + V)"

  # ---- RoPE rotate_half 분할 축 ----
  # `rotate_half(x)`는 마지막 축을 정확히 반으로 자른다:
  #   x1 = x[..., : d//2];  x2 = x[..., d//2 :];  return cat((-x2, x1))
  # 트레이스에서 self_attn의 `slice` → `neg` → `concat` 3연속으로 나타나고, cos/sin을 만드는
  # `rotary_emb`의 inv_freq도 같은 폭이다. 즉 이 축은 **회전 차원의 절반**이지 다른 무엇도 아니다.
  # 규칙으로 등록하기 전에는 휴리스틱이 값만 맞는 이름을 붙였다 — Llama-3.1-8B `2*n_h`,
  # SmolLM3 `4*n_h`, GLM-4.5-Air·gpt-oss `4*n_kv`, DeepSeek-V3 `4*k`, tiny-deepseek-v3 `4*E`,
  # Llama-3.1-405B `n_h/2`. 전부 산술적으로는 참이라 게이트가 못 잡았고, 자유 평가에서 나왔다
  # (2026-07-31). 출처: transformers 공통 `rotate_half` / `apply_rotary_pos_emb`.
  # 부분·decoupled RoPE는 head 전체가 아니라 d_rope만 회전하므로 그쪽을 먼저 본다.
  - expr: "d_rope // 2"
    scope: "attn|attention|rotary"
    sym: "d_rope/2"
    name: "d_rope/2 (부분/decoupled RoPE의 rotate_half 분할 축)"
  - expr: "d_head // 2"
    scope: "attn|attention|rotary"
    sym: "d_head/2"
    name: "d_head/2 (RoPE rotate_half 분할 축)"

  # ---- mHC (Manifold-Constrained Hyper-Connections) ----
  # 잔차를 n_hc개 병렬 스트림으로 유지하므로 hc 모듈의 입력 폭은 n_hc·d_model이고,
  # 게이트 파라미터는 pre(n_hc) + post(n_hc) + comb(n_hc²) = (2+n_hc)·n_hc개다.
  # DeepSeek-V4-Pro 실측: `attn_hc.fn` = [24, 28672] = [(2+4)·4, 4·7168] ✓
  # 이전에는 `4*k`(24)·`4*d_model`(28672)로 찍혔다 — k는 expert top-k라 잔차 연결과 무관하다.
  # 출처: rules/structures/residual/mhc.md(파라미터 shape가 이미 이 식으로 문서화돼 있었다),
  # DeepSeek-V4 paper §2.2, Hyper-Connections (Zhu et al.).
  - expr: "n_hc * d_model"
    scope: "_hc|hyper"
    sym: "n_hc*d_model"
    name: "n_hc·d_model (mHC: n_hc개 잔차 스트림을 편 폭)"
  - expr: "(2 + n_hc) * n_hc"
    scope: "_hc|hyper"
    sym: "(2+n_hc)*n_hc"
    name: "(2+n_hc)·n_hc (mHC 게이트 파라미터 수: pre n_hc + post n_hc + comb n_hc²)"
  # sym에 `^`를 쓰면 안 된다 — 렌더된 라벨은 검증에서 그대로 eval되는데 Python `^`는 거듭제곱이
  # 아니라 XOR이다. `n_hc^2`로 뒀다가 산술 검사에서 588건이 거짓으로 잡혔다(2026-07-31).
  - expr: "n_hc * n_hc"
    scope: "_hc|hyper"
    sym: "n_hc*n_hc"
    name: "n_hc² (mHC comb 행렬 원소 수)"

  # ---- GQA repeat 계수 ----
  # repeat_kv가 KV head를 Q head 수만큼 복제할 때 나타나는 expand 축.
  # 출처: transformers 공통 `repeat_kv`, 01-main.md C7.
  - expr: "n_h // n_kv"
    scope: "attn|attention"
    sym: "n_h/n_kv"
    name: "n_h/n_kv (GQA repeat 계수 — repeat_kv의 expand 축)"

  # ---- sliding window mask ----
  - expr: "w_local - 1"
    scope: "attn|attention"
    sym: "w_local-1"
    name: "w_local − 1 (sliding window mask 밴드 폭)"

  # ---- SSM / Mamba-2 ----
  # d_inner = n_h_ssm·d_head_ssm. conv1d는 d_inner + 2·n_g·d_state를 받고,
  # in_proj는 gate+x(2·d_inner) + B,C(2·n_g·d_state) + dt(head당 1)를 한 번에 낸다.
  # 출처: transformers nemotron_h/mamba2 modeling, rules/structures/ssm/mamba.md
  # d_inner 자체. Zamba2는 이걸 `int(config.mamba_expand * hidden_size)` 로 계산하는데,
  # float 곱이라 int() 가 필요하고 그 순간 config 태그가 벗겨진다(§6.4의 원리적 손실 사례).
  # 검증된 식으로 되찾는다: d_inner = n_h_ssm · d_head_ssm.
  # 출처: transformers/models/zamba2/modeling_zamba2.py:420,436 (self.intermediate_size 가
  #       conv_dim = intermediate_size + 2·n_groups·ssm_state_size 의 첫 항).
  - expr: "n_h_ssm * d_head_ssm"
    scope: "mamba|mixer|ssm|conv1d"
    sym: "d_inner"
    name: "d_inner (Mamba 내부 폭 = n_h_ssm · d_head_ssm)"

  # conv1d 입력 폭. 위 주석대로 conv1d 는 d_inner + 2·n_g·d_state 를 받는다. 규칙이 없으면
  # d_inner 쪽 태그가 int() 로 죽은 모델에서 `(4096+2*d_state)` 처럼 반쪽짜리 식이 남는다.
  - expr: "n_h_ssm * d_head_ssm + 2 * n_g_ssm * d_state"
    scope: "mamba|mixer|ssm|conv1d"
    sym: "d_inner+2*n_g*d_state"
    name: "d_inner + 2·n_g·d_state (conv1d 입력 폭)"

  - expr: "2 * n_h_ssm * d_head_ssm + 2 * n_g_ssm * d_state + n_h_ssm"
    scope: "mamba|mixer|ssm|in_proj"
    sym: "2*d_inner+2*n_g*d_state+n_h_ssm"
    name: "2·d_inner + 2·n_g·d_state + n_h_ssm (Mamba in_proj 출력: gate+x, B+C, dt)"
  - expr: "n_h_ssm * d_head_ssm + 2 * n_g_ssm * d_state"
    scope: "mamba|mixer|ssm|conv1d|act"
    sym: "d_inner+2*n_g*d_state"
    name: "d_inner + 2·n_g·d_state (Mamba causal conv1d 폭: x, B, C)"
  - expr: "n_h_ssm * d_head_ssm"
    scope: "mamba|mixer|ssm"
    sym: "d_inner"
    name: "n_h_ssm·d_head_ssm (Mamba d_inner)"

  # ---- 선형 attention (Gated DeltaNet) ----
  # in_proj_qkvz는 q,k(각 n_k·d_k)와 v,z(각 n_v·d_v)를 한 번에 낸다.
  # 출처: transformers qwen3_next modeling, rules/structures/attention/gated-deltanet.md
  - expr: "2 * n_h_lin_k * d_head_lin_k + 2 * n_h_lin_v * d_head_lin_v"
    scope: "linear_attn|in_proj"
    sym: "2*n_k*d_k+2*n_v*d_v"
    name: "2·(n_k·d_k) + 2·(n_v·d_v) (DeltaNet in_proj_qkvz 출력: q,k,v,z)"
  - expr: "n_h_lin_k * d_head_lin_k + 2 * n_h_lin_v * d_head_lin_v"
    scope: "linear_attn|in_proj"
    sym: "n_k*d_k+2*n_v*d_v"
    name: "n_k·d_k + 2·(n_v·d_v)"
  - expr: "T * n_h_lin_v"
    scope: "linear_attn|norm"
    sym: "T*n_h_lin_v"
    name: "T·n_h_lin_v (value head 축까지 flatten — gated norm 입력)"

  # ---- 부분 RoPE의 rotate_half (d_rope 필드가 없고 계수만 있는 모델) ----
  # GLM-4.5-Air는 `qk_rope_head_dim` 같은 필드 없이 `partial_rotary_factor=0.5`만 준다.
  # 회전 차원 = round(d_head·pr) = 64이고 rotate_half는 그 절반인 32를 자른다. 규칙이 없어서
  # 32가 `4*n_kv`(=4·8)로 찍혀 있었다 — expert도 KV head도 아닌 축이다(자유 평가 2026-07-31).
  - expr: "round(d_head * pr) // 2"
    scope: "attn|attention|rotary"
    sym: "d_rope/2"
    name: "d_rope/2 (partial_rotary_factor 기준 rotate_half 분할 축)"
  # 회전 차원 자체. `qk_rope_head_dim` 필드가 있는 모델은 d_rope 심볼로 바로 잡히지만,
  # 계수만 주는 모델(Qwen3-Next pr=0.25·d_head=256 → 64, GLM pr=0.5·128 → 64)은 규칙이 필요하다.
  - expr: "round(d_head * pr)"
    scope: "attn|attention|rotary"
    sym: "d_rope"
    name: "d_rope (partial_rotary_factor 기준 회전 차원)"

  # ---- Mamba-2 게이트 정규화 / conv 패딩 (Nemotron) ----
  # 출처: transformers nemotron_h/mamba2 modeling, rules/structures/ssm/mamba.md
  # gated RMSNorm은 그룹 단위로 걸린다 → 마지막 축이 d_inner/n_g.
  # causal conv1d는 왼쪽으로 (d_conv-1)만큼 패딩하므로 시퀀스 축이 T + d_conv - 1이 된다.
  - expr: "n_h_ssm * d_head_ssm // n_g_ssm"
    scope: "mamba|mixer|ssm|norm"
    sym: "d_inner/n_g"
    name: "d_inner/n_g_ssm (Mamba gated RMSNorm의 그룹당 폭)"
  - expr: "n_g_ssm * d_state"
    scope: "mamba|mixer|ssm|conv1d"
    sym: "n_g*d_state"
    name: "n_g_ssm·d_state (B/C 하나의 폭)"
  - expr: "T + d_conv - 1"
    scope: "mamba|mixer|ssm|conv1d"
    sym: "T+d_conv-1"
    name: "T + d_conv − 1 (causal conv1d 좌측 패딩 포함 길이)"

  # ---- xLSTM q/k/v 투영 폭 ----
  # 출처: NX-AI xlstm 공식 구현 — q/k는 d_model·qk_dim_factor, v는 d_model·v_dim_factor.
  # xLSTM-7b는 qk_dim_factor=0.5라 q/k 폭이 2048이고, 규칙이 없을 때는 `4*d_head`로 찍혔다.
  - expr: "d_model * qk_f"
    scope: "mlstm|xlstm|\\.q$|\\.k$|q_|k_"
    sym: "d_model*qk_f"
    name: "d_model·qk_dim_factor (xLSTM q/k 투영 폭)"
  - expr: "d_model * v_f"
    scope: "mlstm|xlstm|\\.v$|v_"
    sym: "d_model*v_f"
    name: "d_model·v_dim_factor (xLSTM v 투영 폭)"
  # head당 폭. xLSTM-7b는 4096·0.5/8 = 256이고, 규칙이 없을 때는 `T*T`로 찍혔다(T=16이라 우연히
  # 256). 시퀀스 길이가 바뀌면 즉시 거짓이 되는 라벨이었다.
  - expr: "d_model * qk_f // n_h"
    scope: "mlstm|xlstm|mlstm_backend"
    sym: "d_model*qk_f/n_h"
    name: "d_model·qk_dim_factor/n_h (xLSTM head당 q/k 차원)"

  # ---- xLSTM FFN ----
  # 출처: NX-AI xlstm 공식 구현 — up-projection 폭 = round_up(d_model·ffn_proj_factor, 단위)
  - expr: "ceil(d_model * ffn_f / ffn_r) * ffn_r"
    scope: "ffn|mlp|proj_up|proj_down|act"
    sym: "roundup(d_model*ffn_f,ffn_r)"
    name: "round_up(d_model·ffn_proj_factor, ffn_round_up_to_multiple_of) (xLSTM FFN 폭)"

  # ---- MLA 합성 차원 (Phase 6에서 확인, 기존 _known_composites에서 이관) ----
  - expr: "n_h * (d_nope + d_v)"
    scope: "attn|attention"
    sym: "n_h*(d_nope+d_v)"
    name: "n_h·(d_nope+d_v) (MLA kv_b_proj 출력)"
  - expr: "n_h * (d_nope + d_rope)"
    scope: "attn|attention"
    sym: "n_h*(d_nope+d_rope)"
    name: "n_h·(d_nope+d_rope) (MLA q_b_proj 출력)"
  - expr: "c_kv + d_rope"
    scope: "attn|attention"
    sym: "c_kv+d_rope"
    name: "c_kv+d_rope (MLA kv_a_proj_with_mqa 출력)"
  - expr: "n_h * d_v"
    scope: "attn|attention"
    sym: "n_h*d_v"
    name: "n_h·d_v (attention 출력, o_proj 직전)"
  - expr: "n_h * d_nope"
    scope: "attn|attention"
    sym: "n_h*d_nope"
    name: "n_h·d_nope"
  - expr: "n_h * d_rope"
    scope: "attn|attention|indexer"
    sym: "n_h*d_rope"
    name: "n_h·d_rope"
  - expr: "d_nope + d_rope"
    scope: "attn|attention"
    sym: "d_nope+d_rope"
    name: "d_nope+d_rope (q/k head 전체 차원)"
  - expr: "d_nope + d_v"
    scope: "attn|attention"
    sym: "d_nope+d_v"
    name: "d_nope+d_v"

  # ---- 공통 투영 폭 ----
  - expr: "n_h * d_head"
    scope: "attn|attention|o_proj|q_proj|k_proj|v_proj"
    sym: "n_h*d_head"
    name: "n_h·d_head (Q 투영 폭 / attention 출력 폭)"
  - expr: "n_kv * d_head"
    scope: "attn|attention|k_proj|v_proj"
    sym: "n_kv*d_head"
    name: "n_kv·d_head (KV 투영 폭)"
  - expr: "2 * n_kv * d_head"
    scope: "attn|attention|k_proj|v_proj"
    sym: "2*n_kv*d_head"
    name: "2·n_kv·d_head (K와 V 합친 투영 폭)"
  # E·k(토큰당 라우팅되는 (expert,slot) 쌍 총수)는 MoE 경로에서만 의미가 있다. 스코프가 없어서
  # **전역 파생 규칙**으로 동작했고, self_attn 안에서 값이 우연히 같은 축을 가로챘다 —
  # gpt-oss-20b는 E·k = 32·4 = 128 == sliding_window라 decode sliding 레이어의 attention
  # 컨텍스트 길이가 `E*k`로 찍혔다(외부 검토 2026-07-30). E와 k 자신의 스코프와 같은 값으로 맞춘다.
  - expr: "E * k"
    scope: "expert|moe|router|gate(?!_proj)"
    sym: "E*k"
    name: "E·k (토큰당 라우팅 (expert,slot) 쌍 총수)"

  # ---- attention sink (gpt-oss) ----
  # sink는 K/V를 늘리지 않고 **score 행렬에만** 학습형 로짓 1열을 더한다. 그래서 같은 op 쌍에서
  # bmm의 K축(= 실제 KV 길이)과 softmax 폭이 정확히 n_sink만큼 어긋난다:
  #   decode full 레이어    bmm K축 = T+1 (캐시 T + 새 토큰 1)  →  softmax = T+1+n_sink
  #   decode sliding 레이어 bmm K축 = w_local (캐시가 window 상한) →  softmax = w_local+n_sink
  # prefill에는 규칙을 두지 않는다 — 거기서 T+1은 sink지만 decode에서 T+1은 KV 길이라서, 단계
  # 구분이 없는 derived_dims에 넣으면 decode의 KV 길이를 sink로 오라벨한다.
  # 출처: transformers models/gpt_oss/modeling_gpt_oss.py (GptOssAttention.sinks를 score에 concat),
  # rules/structures/attention/attention-sink.md
  - expr: "T + 1 + n_sink"
    scope: "attn|attention"
    sym: "(T+1)+n_sink"
    name: "(T+1) + n_sink (decode full 레이어 score 폭: KV 길이 ⊕ attention sink)"
  - expr: "w_local + n_sink"
    scope: "attn|attention"
    sym: "w_local+n_sink"
    name: "w_local + n_sink (decode sliding 레이어 score 폭: window KV ⊕ attention sink)"
