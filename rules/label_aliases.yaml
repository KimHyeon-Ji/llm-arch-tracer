# 선언된 alias·유도. **항목은 근거를 확인한 뒤에만 넣는다.**
#
# 왜 이 파일이 있는가: 검토자가 `n_chunk` 처럼 유도된 이름을 제안하면, 현재 라벨
# (`T/d_chunk`)과 문자열·다항식으로는 같지 않으므로 비교가 `cannot_determine` 이 된다.
# 독립적인 소스 근거로 유도 관계가 확인됐을 때 여기 등록하고 비교를 다시 돌린다.
#
# **검토자가 제안했다는 이유만으로 등록하지 않는다**(외부 검토 2026-09-25).
# 그리고 여기에 미리 채워 두면 그것이 곧 후보 목록이 되어 블라인드가 약해진다.
# 그래서 지금은 비어 있다.
#
# **전역 alias 는 금지다.** 같은 기호가 모델마다 다른 뜻일 수 있으므로 항목마다
# `model` 을 적어야 하고, 없으면 `load_aliases()` 가 `ValueError` 로 거부한다.
#
# 형식:
#
#   aliases:
#     n_chunk:
#       expr: T/d_chunk                    # 유도식 (필수)
#       model: moonshotai__Kimi-K3         # 필수. 목록도 된다. 모든 모델은 "*"
#       phase: [prefill, decode]           # 생략하면 둘 다
#       source: "modeling_kimi_linear.py:120-138"   # 근거 인용
#       answer_id: A-xxxxxxxxxxxx          # 어느 답에서 나왔는가 (있으면)
#
# 주의: `expr` 안의 `/` 는 floor division 이다. 유도식에 나눗셈이 들어가면 그 alias 를
# 쓴 비교는 정규형이 어긋날 때 `different` 가 아니라 `cannot_determine` 이 된다.

aliases: {}
