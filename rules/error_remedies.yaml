# Tier 1 알려진 오류 패턴표. src/adapt.py가 읽는다. (02-new-module-handling.md Tier 1)
# pattern: regex (대소문자 무시), remedy: RunContext(run.py)의 메서드 이름

- pattern: "NotImplementedError|could not run .*meta"
  remedy: meta_to_fake
- pattern: "Boolean value of Tensor"
  remedy: attn_sdpa
- pattern: "data-dependent"
  remedy: attn_eager
- pattern: "(k out of range|topk|index.*out of range)"
  remedy: bump_seq_len
- pattern: "Expected inputs of BF16|Expected .*bfloat16"
  remedy: use_bf16
- pattern: "[Cc]ache"
  remedy: rebuild_cache
